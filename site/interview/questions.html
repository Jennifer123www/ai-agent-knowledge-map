    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.62}a{color:inherit;text-underline-offset:3px}button{font:inherit;cursor:pointer}.shell{width:min(1280px,calc(100% - 36px));margin:0 auto}.top{border-bottom:1px solid var(--line);background:var(--surface)}.topin{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:16px;color:var(--muted);font-size:12px}.back{flex:0 0 auto;color:var(--accent);font-weight:800;text-decoration:none}.global-nav{display:flex;flex:1 1 auto;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px}.global-nav a{color:var(--muted);font-size:12px;font-weight:700;text-decoration:none}.global-nav a:hover,.global-nav a[aria-current="page"]{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px}.meta{text-align:right}.layout{display:grid;grid-template-columns:242px minmax(0,1fr);gap:34px;padding:34px 0 62px}.navpanel{position:sticky;top:20px;align-self:start;padding-right:18px;border-right:1px solid var(--line)}.navpanel h2{margin:0 0 8px;font-size:14px}.navpanel p{margin:0 0 14px;color:var(--muted);font-size:12px}.navlist{margin:0;padding:0;list-style:none}.navlist a{display:block;padding:8px 8px 8px 10px;border-left:3px solid transparent;color:var(--muted);font-size:13px;text-decoration:none}.navlist a:hover,.navlist a[aria-current="page"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:800}.navlist small{display:block;color:var(--muted);font-size:10px;font-weight:400}.content{min-width:0}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{max-width:900px;margin-bottom:13px;font-size:clamp(32px,5vw,53px);line-height:1.08;letter-spacing:0}h1 span{display:bl gin:0;padding:0;list-style:none;counter-reset:answer}.answer-list li{position:relative;min-height:48px;padding:11px 0 11px 45px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.answer-list li::before{position:absolute;top:12px;left:0;display:grid;width:27px;height:27px;place-items:center;background:var(--soft);color:var(--accent);content:counter(answer);counter-increment:answer;font-size:11px;font-weight:800}.answer-list b{color:var(--ink)}.memory{margin:20px 0 0;padding:14px;border-left:4px solid var(--accent);background:var(--soft);font-size:13px}.memory b{color:var(--accent)}.answer-side h4{margin:0 0 10px;font-size:17px}.answer-side p{margin:0 0 16px;color:var(--muted);font-size:13px}.side-block{padding-top:14px;border-top:1px solid var(--line)}.side-block+.side-block{margin-top:14px}.side-block strong{display:block;margin-bottom:4px;font-size:13px}.side-block span{color:var(--muted);font-size:12px}.diagram{overflow:auto;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}.diagram-inner{display:flex;min-width:780px;align-items:stretch}.step{position:relative;flex:1;padding:20px 16px;border-right:1px solid var(--line)}.step:last-child{border-right:0}.step::after{position:absolute;right:-11px;top:50%;z-index:2;color:var(--accent);content:"->";font-weight:900}.step:last-child::after{display:none}.step .letter{display:block;margin-bottom:8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}.step strong{display:block;margin-bottom:5px;font-size:16px}.step p{margin:0;color:var(--muted);font-size:12px}.caption{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.follow{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}.follow > div{padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}.follow strong{display:block;margin-bottom:7px;color:var(--accent);font-size:12px}.follow ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}.follow li+li{margin-top:5px}.refs{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0;padding:0;list-style:none}.refs a{color:var(--accent);font-size:12px;font-weight:800}.footer{padding:23px 0 52px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr;gap:24px}.navpanel{position:static;padding:0;border:0}.navlist{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.navlist a{height:100%;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.navlist a[aria-current="page"]{box-shadow:inset 3px 0 var(--accent)}}@media(max-width:720px){.shell{width:min(100% - 24px,1280px)}.topin{align-items:flex-start;flex-direction:column;justify-content:center;gap:7px;padding:8px 0}.global-nav{justify-content:flex-start;gap:4px 14px}.meta{text-align:left}.head{grid-template-columns:1fr;gap:10px}.navlist{grid-template-columns:1fr 1fr}.question-tabs{grid-template-columns:1fr}.answer{grid-template-columns:1fr}.answer-main{border-right:0;border-bottom:1px solid var(--line)}.follow{grid-template-columns:1fr}}@media print{:root{--paper:#fff;--surface:#fff;--soft:#f5f5f5;--ink:#111;--muted:#555;--line:#bbb}.navpanel,.global-nav{display:none}.layout{display:block;padding-top:20px}.section{padding:24px 0}.answer,.diagram,.question-tab{box-shadow:none}.answer,.follow>div{break-inside:avoid}}

  <main class="shell layout"><aside class="navpanel"><h2>面试主题</h2><p>每个主题三道核心题：概念、取舍、生产。答题时优先讲清因果和边界，而不是堆术语。</p><nav class="navlist" id="nav"></nav></aside><article class="content" id="content"></article></main>
  <footer class="shell footer">AI Agent 面试知识图谱 · 题目下钻页 · 页面版本 1.4 · 修改时间 2026-09-18 22:15 CST · 频率资料与原始来源访问：2026-09-17。</footer>
  <script>
    const refs={
      transformer:['Transformer','https://arxiv.org/abs/1706.03762'], rag:['RAG','https://arxiv.org/abs/2005.11401'], react:['ReAct','https://arxiv.org/abs/2210.03629'], toolformer:['Toolformer','https://arxiv.org/abs/2302.04761'], tot:['Tree of Thoughts','https://arxiv.org/abs/2305.10601'], reflexion:['Reflexion','https://arxiv.org/abs/2303.11366'], middle:['Lost in the Middle','https://arxiv.org/abs/2307.03172'], memgpt:['MemGPT','https://arxiv.org/abs/2310.08560'], mcp:['MCP 规范','https://modelcontextprotocol.io/specification/2025-06-18'], a2a:['A2A 规范','https://a2a-protocol.org/latest/'], anth:['Anthropic 工程文章','https://www.anthropic.com/engineering/building-effective-agents'], graph:['LangGraph 文档','https://docs.langchain.com/oss/python/langgraph/overview'], autogen:['AutoGen Core','https://microsoft.github.io/autogen/stable/user-guide/core-user-guide/index.html'], agentsdk:['OpenAI Agents SDK','https://openai.github.io/openai-agents-js/'], bench:['AgentBench','https://arxiv.org/abs/2308.03688'], gaia:['GAIA','https://arxiv.org/abs/2311.12983'], swe:['SWE-bench','https://arxiv.org/abs/2310.06770'], web:['WebArena','https://arxiv.org/abs/2307.13854']
    };
    const Q=(id,title,level,principle,points,memory,steps,follow,avoid,evidence)=>({id,title,level,principle,points,memory,steps,follow,avoid,evidence});
    const topics={
      foundation:{no:'01',title:'基础模型与推理',en:'Foundation Models and Inference',color:'var(--plum)',intro:'这一组题考察你是否理解模型能力的来源和边界。面试中不必推导完整矩阵公式，但需要把“注意力、上下文、采样”讲成对质量、成本和可靠性有影响的工程变量。',ask:'你是否能从模型机制推导出实际系统的质量、时延和成本取舍？',refs:['transformer','middle'],questions:[
        Q('attention','解释自注意力机制，它为什么对大语言模型重要？','中级','自注意力机制（self-attention）让当前词元根据相关性动态参考同一序列中的其他词元。它通过查询（Query）、键（Key）和值（Value）计算加权信息，使模型能处理远距离依赖。',['<b>定义：</b>Q 表示当前要找什么，K 表示每个位置可被匹配的特征，V 是该位置贡献的信息。','<b>机制：</b>计算 Q 与 K 的相似度，经缩放和 softmax 变成权重，再对 V 加权求和；多头注意力让模型从多种关系视角观察序列。','<b>价值：</b>它比纯循环结构更易并行，也能建立长距离关系；这构成 Transformer 处理上下文的核心。','<b>工程取舍：</b>标准注意力随序列长度增长的计算与显存成本较高，因此上下文长度、缓存和模型架构都会影响时延。'],'<b>记忆点：</b>“当前在问什么是 Q，谁更相关看 K，从哪里取信息是 V；注意力解决关联，不能单独保证事实正确。”',['输入词元','生成 Q、K、V 表示','相关性归一化','加权汇总上下文'],['为什么要除以根号 d_k？','自注意力与交叉注意力有什么区别？','注意力权重能否当作完整解释？'],'只说“注意力就是关注重点”，而不说明 Q/K/V、输出和计算代价。',['transformer']),
        Q('contextwindow','上下文窗口很长，为什么模型仍可能答错？','中级','上下文窗口指一次推断能接收的 token 数量。它扩大了可见信息范围，但并不保证模型会稳定使用每一段信息；相关性、位置、噪声、成本和指令冲突都会影响结果。',['<b>先定边界：</b>上下文长度是容量，不是检索质量或事实性的保证。','<b>解释失败：</b>长文本存在注意力分散和“中间信息被忽略”等现象；无关资料还会稀释关键约束。','<b>工程做法：</b>先检索和权限过滤，再把最相关、最新、可引用的证据按重要性组织进上下文，并进行压缩和缓存。','<b>验证：</b>用不同位置、不同长度和干扰内容构造评测集，观察答案引用和任务成功率。'],'<b>记忆点：</b>“长不等于好；先选对，再排好，最后压短。”',['全部候选资料','过滤与检索','排序、压缩、构造上下文','模型生成并引用证据'],['长上下文与 RAG 如何选择？','为什么提示词要把硬约束放在前面？','如何做上下文缓存？'],'回答“窗口足够长就把所有文档放进去”，忽略噪声、权限、成本与位置效应。',['middle','rag']),
        Q('sampling','温度、top-k、top-p 如何影响模型输出？','基础','模型先给每个候选下一个词元一个概率分布。温度改变分布的尖锐程度；top-k 只在概率最高的 k 个候选中选；top-p（核采样）在累计概率达到阈值的候选集合中选。',['<b>温度：</b>低温度更偏向高概率候选，通常更稳定；高温度增加多样性，但也可能增加不一致。','<b>top-k 与 top-p：</b>top-k 固定候选数量，top-p 根据分布动态保留累计概率范围；二者都是限制采样尾部的方法。','<b>场景：</b>工具参数、结构化输出、抽取任务优先稳定和模式校验；创意生成可适度增加多样性。','<b>边界：</b>采样参数不能修复知识错误、工具权限错误或检索失败。'],'<b>记忆点：</b>“温度调随机性，top-k 固定人数，top-p 固定概率质量；关键任务靠校验，不靠玄学调参。”',['候选词元概率','温度调整分布','top-k 或 top-p 截断','采样或选择输出'],['为什么低温度也会答错？','JSON 输出仅靠低温度够吗？','什么是 logit？'],'把温度说成“准确率旋钮”，或认为调低温度就能解决幻觉。',['transformer'])]},
      rag:{no:'02',title:'知识检索与检索增强生成',en:'Knowledge Retrieval and RAG',color:'var(--teal)',intro:'RAG 题常从“它是什么”迅速进入切分、召回、重排序、引用、评测和故障排查。高分回答必须说明它解决知识新鲜度和可追溯性，但不是万无一失的事实保证。',ask:'你能否把 RAG 讲成一条可观测、可评测、可迭代的检索与生成链路？',refs:['rag','middle'],questions:[
        Q('ragvsft','RAG 与微调如何选择？','中级','RAG（检索增强生成）在推断时从外部知识库取回资料；微调通过训练改变模型参数或行为。两者解决的问题不同，常可组合。',['<b>RAG 优先的情况：</b>知识频繁更新、需要引用来源、资料量大、权限分层明显，或希望不改模型参数。','<b>微调优先的情况：</b>需要稳定的风格、格式、分类边界或领域行为，且有高质量、长期稳定的训练数据。','<b>常见组合：</b>微调改善行为或格式，RAG 提供最新事实；不要用微调去追逐每天变动的知识。','<b>验证：</b>比较知识正确率、引用质量、更新成本、数据治理难度、时延和总成本。'],'<b>记忆点：</b>“知识会变，优先检索；行为要固化，再考虑微调。”',['任务需求','判断知识还是行为问题','选择 RAG、微调或组合','离线与线上评测'],['什么时候只用长上下文？','RAG 为什么可能比微调更便宜？','如何处理私有知识？'],'把 RAG 说成“模型联网”，或把微调说成“把所有文档塞进模型”。',['rag','middle']),
        Q('retrievaldesign','如何设计 RAG 的切分、召回和重排序链路？','高级','RAG 的质量取决于是否把正确、完整、可访问的证据送给模型。切分、元数据、检索策略与重排序各负责不同阶段，不能只盯向量数据库。',['<b>资料准备：</b>按文档结构、语义边界和业务单元切分，保留标题、版本、生效时间、权限和来源位置等元数据。','<b>召回：</b>向量检索擅长语义相似，关键词检索擅长精确名词和编号；混合检索通常更稳。','<b>重排序：</b>用查询与候选的更细粒度匹配模型，从较多候选中选出少量高相关片段。','<b>生成：</b>限制证据数量，要求引用；资料不足时允许回答“不足以判断”并追问。'],'<b>记忆点：</b>“切得对、找得全、排得准、答得有据。”',['原始资料与元数据','混合召回较多候选','重排序筛出高相关证据','生成带引用回答'],['块大小和重叠如何定？','为什么需要元数据过滤？','什么时候需要 GraphRAG？'],'只回答“按固定长度切块，再做向量检索”，忽略文档结构、权限、关键词和重排序。',['rag']),
        Q('rageval','如何评测并排查一个 RAG 系统失败？','高级','RAG 失败可能发生在资料、切分、索引、召回、重排序、上下文构造或生成阶段。因此需要把“最终答案错”拆成可定位的链路问题。',['<b>定义指标：</b>检索召回率、上下文相关性、引用正确性、答案正确性、拒答恰当性、时延和成本。','<b>构造数据：</b>覆盖常见问法、精确编号、跨文档问题、过期资料、权限边界和无答案问题。','<b>链路追踪：</b>记录查询、候选、排序、最终证据、生成答案和模型/索引版本，才能定位是哪一层失效。','<b>改进顺序：</b>先确认有没有找到正确资料，再看是否排在前面、是否被正确放入上下文，最后才看生成策略。'],'<b>记忆点：</b>“先查有没有找对，再查有没有排对，最后才查有没有说对。”',['标准问题与答案证据','检索和重排序轨迹','生成与引用评分','归因、修复、回归测试'],['如何评测没有标准答案的问题？','线上用户反馈怎么进入评测集？','什么是上下文相关性？'],'只看最终回答的主观好坏，无法区分检索问题与生成问题。',['rag','bench'])]},
      agent:{no:'04',title:'智能体与工作流',en:'Agents and Workflows',color:'var(--green)',intro:'这类题真正考察的是系统边界：什么时候让模型动态决定下一步，什么时候把路径写死；如何让循环停止；工具失败怎样可控。回答时应主动谈复杂度、可预测性和人类介入。',ask:'你能否在自主性、可预测性、成本和安全之间做清楚的系统选择？',refs:['anth','react','tot'],questions:[
        Q('agentworkflow','智能体与工作流有什么区别，什么时候用哪一个？','中级','工作流（workflow）主要由代码预先决定步骤和分支；智能体（agent）在目标和边界内动态决定流程或工具使用。两者可组合，不是互斥标签。',['<b>定义边界：</b>工作流的控制路径更确定，适合规则明确、合规要求高、失败后果可预见的任务；Agent 适合任务路径未知、需要动态查找或判断的场景。','<b>先简单后复杂：</b>能用单次模型调用或固定工作流解决的问题，不要为了“智能”引入长循环。','<b>组合方式：</b>把 Agent 放在需要判断的节点，把审批、账务写入、状态迁移等确定步骤放在工作流中。','<b>取舍：</b>Agent 带来灵活性，也带来成本、时延、可测试性和调试难度。'],'<b>记忆点：</b>“路径已知用工作流；路径未知但可受控，才用智能体。”',['任务目标','判断路径是否已知','固定流程或 Agent 决策','验证、交接或停止'],['为什么不总是用 Agent？','如何让工作流调用 Agent？','Agent 的成功标准如何定义？'],'把 Agent 描述成“比工作流更高级”，而不说复杂度和适用边界。',['anth','graph']),
        Q('reactplan','ReAct 与计划-执行如何选择？','中级','ReAct（Reason + Act）在每一步观察后决定下一步，适合信息逐步揭示的任务；计划-执行先形成较长计划，再逐步执行，适合依赖关系较清晰的复杂任务。',['<b>ReAct：</b>短循环、即时观察、及时修正，适合网页搜索、诊断、交互式工具任务。','<b>计划-执行：</b>先拆分依赖和子任务，有利于并行、预算和整体结构，但初始计划错误会向后传播。','<b>混合：</b>先做高层计划，每个子任务内部用 ReAct；关键节点根据工具结果重新规划。','<b>工程约束：</b>两者都要有预算、最大步数、超时、失败类别和停止条件。'],'<b>记忆点：</b>“信息边做边现，用 ReAct；依赖先看全局，用计划；现实常是两者嵌套。”',['目标','短循环观察或高层计划','调用工具并获取反馈','修订、完成或交接'],['计划错了如何恢复？','什么任务不适合 ReAct？','如何并行执行计划？'],'只说“ReAct 是思考加行动”，却没有比较反馈时机、计划代价和失败处理。',['react','tot']),
        Q('loopcontrol','如何防止 Agent 无限循环，并处理工具调用失败？','高级','循环失控通常源于缺乏明确完成条件、工具返回模糊、重试策略不当或模型不断尝试同一无效行动。需要在模型外设置硬约束和可观测状态。',['<b>停止条件：</b>定义任务完成、无进展、达到最大步数/预算/时限、风险升级和等待人工输入等明确状态。','<b>工具契约：</b>返回结构化成功、可重试失败、不可重试失败和需要授权等状态，而不是一段模糊错误文本。','<b>重试与幂等：</b>只对瞬时错误有限重试；带副作用动作使用幂等键或确认机制，避免重复扣款、重复写入。','<b>可观测性：</b>追踪每一步的目标、工具、参数摘要、结果、耗时与状态转移；连续失败时降级或交给人。'],'<b>记忆点：</b>“循环必须有预算、进展判定和出口；重试必须有分类、次数和幂等。”',['目标与预算','Agent 提出行动','工具返回结构化状态','完成、重试、降级或人工交接'],['如何定义“无进展”？','工具超时如何处理？','为什么不能让模型自行决定无限重试？'],'只说“设置最大轮数”，没有进展判断、错误分类、幂等性和人工升级。',['react','agentsdk','graph'])]},
      tools:{no:'05',title:'工具、技能与协议',en:'Tools, Skills and Protocols',color:'var(--orange)',intro:'这组题检查你是否理解“模型产生意图”和“系统执行动作”的分层。技能（Skill）封装可复用的任务方法；工具调用需要可靠契约与权限边界；模型上下文协议（MCP）解决应用到工具/资源的标准连接；智能体对智能体协议（A2A）解决 Agent 间协作。',ask:'你能否分清技能、工具、协议、连接器和 Agent 协作，并解释安全执行的责任边界？',refs:['toolformer','mcp','a2a'],questions:[
        Q('toolreliability','如何保证 Agent 的工具调用可靠？','高级','工具调用不是让模型直接执行任意命令，而是模型提出符合模式的调用意图，执行层负责校验、授权、执行和返回结构化结果。',['<b>契约：</b>定义清晰的工具名称、用途、参数模式、必填项、返回类型和错误码；工具描述避免含糊或过度承诺。','<b>输入校验：</b>在执行层验证类型、范围、业务规则和用户身份，不能只相信模型生成的参数。','<b>副作用控制：</b>对写入、付款、删除等操作加确认、审批、幂等键、审计和可回滚设计。','<b>失败处理：</b>区分可重试、不可重试、需授权和输入不合法；把错误以结构化方式返回给 Agent。'],'<b>记忆点：</b>“模型提议，系统校验；动作分级，副作用可控；结果结构化，失败可分类。”',['工具模式与权限','模型提出调用','执行层校验和执行','返回结果、审计与下一步'],['为什么 JSON schema 还不够？','如何防止重复扣款？','工具描述能否被提示词注入污染？'],'只关注 function calling 格式，不说业务校验、权限、幂等和审计。',['toolformer','agentsdk','mcp']),
        Q('mcp','MCP 的客户端、服务器、工具和资源分别是什么？','中级','模型上下文协议（Model Context Protocol，MCP）是开放协议，让模型应用以标准方式连接外部能力。主机（host）承载应用，客户端（client）在主机中建立连接，服务器（server）提供工具、资源和提示模板等能力。',['<b>角色：</b>Host 是模型应用；Client 是连接器；Server 暴露能力。它们通常通过 JSON-RPC 等标准消息交互。','<b>核心对象：</b>Tools 是可执行函数；Resources 是可读取的数据或上下文；Prompts 是可复用提示模板。','<b>价值：</b>让 IDE、聊天应用或 Agent 不必为每个外部系统各写一套私有接入方式，提高组合性。','<b>安全：</b>MCP 本身不替代授权；工具行为和服务器内容应被审慎对待，用户应了解并控制数据共享与高风险调用。'],'<b>记忆点：</b>“Host 装应用，Client 负责连接，Server 提供能力；Tool 能做事，Resource 能读，Prompt 能复用。”',['模型应用 Host','Client 建连与能力发现','Server 暴露工具、资源、提示模板','受控调用并返回结果'],['MCP 与普通 REST API 有何关系？','资源与工具如何选择？','远程 MCP 的认证怎么做？'],'把 MCP 说成“一个工具库”或“自动授权协议”，忽略 host/client/server 与安全责任。',['mcp']),
        Q('mcpa2a','MCP 与 A2A 的区别和配合方式是什么？','中级','MCP 主要解决单个 Agent/模型应用如何连接工具、API 和资源；A2A（Agent2Agent）主要解决独立 Agent 之间如何发现能力、委派任务、交换进度和结果。两者是互补关系。',['<b>边界：</b>MCP 是 Agent-to-Tool / Context 的连接层；A2A 是 Agent-to-Agent 的协作层。','<b>使用 MCP：</b>当 Agent 需要查数据库、读代码仓库、调用 CRM 或浏览器工具时。','<b>使用 A2A：</b>当需要调用另一个独立、专长不同、可能跨框架或跨组织的 Agent 时。','<b>组合：</b>一个研究 Agent 用 MCP 查资料，再用 A2A 将翻译或法律审阅任务交给专门 Agent。'],'<b>记忆点：</b>“MCP 给 Agent 配工具，A2A 给 Agent 找同事。”',['主 Agent','MCP 接入工具与资料','A2A 委派给远程 Agent','汇总结果与验收'],['何时不需要 A2A？','A2A 会共享内部记忆吗？','如何处理跨 Agent 的权限？'],'把 A2A 当作 MCP 的替代品，或把两者都笼统称为“插件协议”。',['mcp','a2a']),
        Q('skillboundary','Skill、工具与 MCP/A2A 协议分别解决什么问题？','中级','技能（Skill）是可复用的任务做法，通常包含适用条件、步骤、提示模板、工具组合与交付标准；工具执行一个明确动作；MCP 规范模型应用与外部工具/资源的连接；A2A 规范独立 Agent 之间的协作。',['<b>Skill：</b>回答“这类事如何按标准完成”，例如月度对账、代码审查或合同摘要；它可组合多个工具与规则。','<b>工具：</b>回答“现在能执行什么明确动作”，例如查询订单、计算金额、创建工单；需要参数模式与执行校验。','<b>MCP 与 A2A：</b>MCP 解决模型应用接入工具和资源，A2A 解决 Agent 间发现、委派和结果交接；二者都不是业务授权本身。','<b>工程分层：</b>把业务流程放在 Skill/编排层，把原子能力放在工具层，把互操作放在协议层，才能测试、替换和治理。'],'<b>记忆点：</b>“Skill 说明怎么做，工具负责做一步，MCP 负责怎么连，A2A 负责找谁协作。”',['任务目标','Skill 选择步骤与工具组合','工具经 MCP 或本地契约执行','需要专业协作时经 A2A 交接'],['Skill 是否等于提示词？','一个 Skill 如何版本化？','MCP Server 是否可以直接成为 Agent？'],'把 Skill、工具和协议都叫作“插件”，导致流程、执行与互操作的责任混在一起。',['mcp','a2a','agentsdk'])]},
      memory:{no:'03',title:'记忆与上下文工程',en:'Memory and Context Engineering',color:'var(--plum)',intro:'这类题从“记忆是什么”延伸到何时写入、如何更新、是否保留、怎样避免把过期或敏感对话带入当前任务。高分答案会把短期状态、长期偏好、外部知识和当前上下文严格区分。',ask:'你能否控制模型当前看到的信息，并让跨会话经验可更新、可删除、可审计？',refs:['memgpt','middle','rag'],questions:[
        Q('memorytypes','Agent 记忆应如何分类和管理？','中级','Agent 记忆不是聊天记录的无限存档，而是对未来任务有价值的信息集合。常见分类包括会话/任务状态、用户偏好、长期事实、执行经验；不同类型需要不同的写入、更新、保留和访问策略。',['<b>短期状态：</b>当前任务进度、已调用工具、临时变量，随任务完成而过期或归档。','<b>长期偏好与事实：</b>例如语言偏好、授权范围、稳定业务信息，需要来源、时间戳、置信度和更新规则。','<b>经验记忆：</b>从失败或人工反馈中提炼的可复用规则，应经过验证，不把一次偶然错误固化。','<b>治理：</b>写入前判断必要性；支持修改、删除、保留期限、权限隔离和审计。'],'<b>记忆点：</b>“状态管当前，偏好管个性，事实管来源，经验管验证；任何记忆都要能过期和删除。”',['对话与执行轨迹','提取候选记忆','分类、校验、设定保留策略','按权限和相关性读取'],['如何解决记忆冲突？','记忆与知识库的区别？','什么信息不该写入长期记忆？'],'把全部历史对话直接放进长期记忆，忽略过期、隐私、冲突和检索成本。',['memgpt','rag']),
        Q('longcontextrag','长上下文与 RAG 如何选择？','中级','长上下文让模型一次读入更多材料；RAG 先从资料库中选择小量相关证据。前者减少检索链路但成本高、信息利用不稳定；后者可更新、可引用、可做权限过滤，但增加检索质量风险。',['<b>选择长上下文：</b>输入本身是单个完整对象，且需要跨全文综合，例如一次审阅短到中等长度合同。','<b>选择 RAG：</b>资料规模大、知识频繁更新、需要权限/时效过滤、只需少量相关片段或需要引用。','<b>组合：</b>先 RAG 找证据，再把局部完整章节放入较长上下文；不要把它们视为二选一。','<b>评测：</b>比较任务成功、引用完整性、遗漏率、时延和成本，而不是只比较模型窗口大小。'],'<b>记忆点：</b>“整本书都要读，考虑长上下文；书架很大只找几页，优先 RAG。”',['问题与资料规模','判断是否需要全文关系','长上下文、RAG 或组合','评测质量、成本和权限'],['RAG 什么时候会漏召回？','长上下文为什么有中间遗忘？','如何处理表格和图片？'],'把长上下文说成 RAG 的完全替代，或只按 token 上限选择。',['middle','rag']),
        Q('contextengineering','如何设计上下文工程？','高级','上下文工程（context engineering）是围绕有限输入窗口进行选择、排序、压缩、缓存和格式化的系统方法。目标不是塞更多信息，而是让模型在正确位置看到最有用、最可信的内容。',['<b>分层组织：</b>先放系统硬约束与任务目标，再放当前状态、最相关证据、工具结果和必要记忆。','<b>选择与压缩：</b>基于权限、相关性、时效、来源可信度和 token 预算过滤；长资料保留摘要、关键片段和引用。','<b>防污染：</b>把不可信网页、工具返回、用户上传资料标记为数据而非指令；避免它们覆盖系统约束。','<b>验证与缓存：</b>监控上下文长度、检索命中、引用质量和重复调用；缓存要纳入身份、版本和时效性。'],'<b>记忆点：</b>“先规则，后任务；先证据，后装饰；先可信，后全面。”',['候选上下文','权限、相关性和时效过滤','排序、压缩、格式化','模型消费与质量追踪'],['怎样防御上下文中的注入指令？','如何给上下文分 token 预算？','缓存为何需要版本键？'],'只把上下文工程理解为“写更长的提示词”，忽略选择、信任边界和缓存。',['middle','mcp'])]},
      multiagent:{no:'06',title:'多智能体协作',en:'Multi-Agent Systems',color:'var(--rose)',intro:'多智能体是高级题高频区，但答案不应停在“分工合作”。面试官更关注：为什么单 Agent 不够、每个角色的输入输出如何定义、谁负责验收、如何避免错误放大和成本失控。',ask:'你能否证明多智能体带来的收益大于协调、沟通和错误传播成本？',refs:['autogen','a2a','anth'],questions:[
        Q('whenmulti','什么时候需要多智能体，而不是单 Agent 加多个工具？','高级','多智能体适合职责、工具权限、上下文或验收标准能清晰分离的复杂任务。若只是同一模型连续调用几个工具，单 Agent 或工作流通常更简单、更便宜、更易调试。',['<b>使用条件：</b>任务可分解为相对独立的子任务，且专门角色、独立上下文或不同权限能带来明显质量收益。','<b>不使用条件：</b>任务短、依赖强、共享大量上下文、唯一难点只是一个工具调用，或没有明确验收标准。','<b>证明收益：</b>用基线比较单 Agent 与多 Agent 的成功率、时延、Token、工具调用次数和人工返工率。','<b>逐步演进：</b>先把职责拆成模块或子流程，确认瓶颈后再真正引入远程/独立 Agent。'],'<b>记忆点：</b>“分工要有独立交付物；没有独立验收，多 Agent 常常只是更贵的群聊。”',['总任务','判断是否可独立分工','单 Agent / 工作流 / 多 Agent','比较质量与协调成本'],['如何定义子任务边界？','多 Agent 会增加哪些成本？','什么时候使用并行？'],'因为任务复杂就默认多个 Agent，却没有单 Agent 基线和角色验收标准。',['anth','autogen']),
        Q('supervisor','如何设计主管 - 专家型多智能体系统？','高级','主管（supervisor）负责理解总目标、选择专家、跟踪状态和整合结果；专家负责边界明确的子任务。设计重点是任务契约、共享最小必要上下文、验收和升级机制。',['<b>角色契约：</b>每个专家说明输入、可用工具、输出模式、质量标准、权限和不可处理的情况。','<b>委派：</b>主管按任务特征和预算选择专家，传递任务摘要、证据引用和必要状态，而非整段无筛选聊天记录。','<b>验收：</b>主管用规则、测试、交叉验证或独立审核检查交付物；不把“专家说完成了”当作完成。','<b>状态与失败：</b>保存任务标识、依赖、重试、超时和人工升级；避免两个 Agent 对同一资源重复写入。'],'<b>记忆点：</b>“角色有契约，委派有摘要，交付有验收，失败有升级。”',['用户目标','主管拆分并委派','专家产出结构化交付物','主管验证、整合或升级'],['共享记忆如何设计？','专家之间能否直接通信？','主管如何防止反复委派？'],'只画出多个圆圈和箭头，不定义输入输出、验收、状态与权限。',['autogen','a2a','graph']),
        Q('multierrors','如何避免多智能体的错误放大？','高级','错误放大来自不可靠输出被下游当成事实、角色之间循环引用、共享状态竞争和缺少独立验证。解决原则是降低信任默认值，并让关键结论回到可验证证据。',['<b>结构化交付：</b>要求专家输出结论、证据、置信度、假设和未解决项，禁止只传自然语言结论。','<b>验证分离：</b>对关键节点使用规则、测试、检索证据或独立验证者，而不是让同一 Agent 自己宣布正确。','<b>信任与权限：</b>最小化跨 Agent 共享上下文和写权限，采用版本化状态和冲突检测。','<b>停止与成本：</b>限制委派深度、并发数和总预算；发现重复或矛盾时交给主管或人。'],'<b>记忆点：</b>“结论要带证据，关键要独立验，状态要能冲突检测，协作要有预算。”',['专家结论','附证据和置信度','独立验证或规则检查','采纳、驳回或人工升级'],['critic Agent 有什么局限？','如何评测协作收益？','如何处理专家结论冲突？'],'相信“多一个 critic 就一定更正确”，却不说明 critic 的证据来源和失败模式。',['autogen','a2a','bench'])]},
      evaluation:{no:'07',title:'评测、可观测性与持续优化',en:'Evaluation, Observability and Improvement',color:'var(--teal)',intro:'生产型岗位常把这组题作为分水岭。好答案应将结果质量、过程质量、安全、成本与用户体验一起评估，并能用一条 Trace 把问题定位到具体模型、检索、工具或流程版本，再将失败样本纳入持续优化。',ask:'你能否用证据证明 Agent 在完成任务，并在异常时快速归因和改进？',refs:['bench','gaia','graph','agentsdk'],questions:[
        Q('agenteval','如何评测一个 Agent 是否可靠？','高级','Agent 评测应在任务环境中衡量，而不是只看单轮文字是否流畅。可靠性至少包括任务完成、过程正确、事实/引用、安全、成本、时延和恰当升级。',['<b>任务指标：</b>定义可验证完成条件，例如工单是否正确归类、代码测试是否通过、表单是否按规则提交。','<b>过程指标：</b>检查检索证据、工具选择、参数正确性、状态转移和是否遵守权限与预算。','<b>数据集：</b>覆盖常见任务、边界条件、无答案、工具异常、恶意输入和高风险场景，并做版本化管理。','<b>分层评估：</b>离线回归用于发布门槛，沙盒环境验证动作，线上监控与人工反馈发现分布变化。'],'<b>记忆点：</b>“评结果，也评过程；离线守门，线上发现；环境成功比文字好看更重要。”',['任务样本与环境','运行 Agent 轨迹','结果、过程、安全与成本评分','回归、发布与线上反馈'],['如何处理开放式任务？','LLM-as-judge 能完全替代人工吗？','什么是任务成功率？'],'只用用户点赞或单个模型打分，忽略工具行为、安全和可复现任务标准。',['bench','gaia','web']),
        Q('trace','一条 Agent Trace 应记录什么，如何用于排查异常？','高级','Trace 是一次任务跨越模型、检索、工具、状态和子 Agent 的关联记录。它让“用户说结果不对”可以被还原为具体的请求、版本、步骤和外部依赖问题。',['<b>关联标识：</b>任务 ID、会话 ID、父子调用关系、用户/租户与权限上下文（遵守脱敏原则）。','<b>关键 Span：</b>模型与提示版本、检索查询和候选摘要、工具名称/参数摘要/结果、状态转移、耗时、Token、错误码与重试。','<b>排查路径：</b>先看完成条件与异常节点，再判断是输入、知识、模型、工具、权限还是下游依赖问题。','<b>治理：</b>对敏感原文脱敏、采样、访问控制和保留期；可观测性本身也要遵守隐私要求。'],'<b>记忆点：</b>“一条 Trace 要能回答：谁在什么版本下，为了什么目标，调用了什么，结果如何，耗时和代价多少。”',['任务请求','跨组件 Span 记录','发现失败或退化节点','归因、修复、回归验证'],['如何做 Trace 采样？','如何关联多 Agent Trace？','为什么日志不能存全部提示词？'],'只记录最终答案和报错，导致无法定位检索、工具或版本问题。',['graph','agentsdk']),
        Q('offlineonline','离线评测与线上监控如何配合？','中级','离线评测在固定样本和环境中比较版本，保证可重复；线上监控观察真实流量、数据漂移、外部依赖和用户反馈。两者互补，不能相互替代。',['<b>离线：</b>用于发布前回归、提示词/模型/索引对比和边界案例验证，指标稳定、可重复。','<b>线上：</b>关注真实成功率、异常率、时延、成本、人工接管、安全事件和新型失败。','<b>闭环：</b>线上失败样本经脱敏、标注和复核后进入离线集，形成新的回归门槛。','<b>发布策略：</b>先在沙盒和离线通过，再灰度发布；监控退化阈值，支持快速回滚。'],'<b>记忆点：</b>“离线做对照，线上看现实；线上失败回流离线，版本发布可回滚。”',['候选版本','离线任务与沙盒评测','灰度上线与指标监控','失败回流、优化与回滚'],['如何设置灰度阈值？','线上没有标准答案怎么办？','什么情况必须停止发布？'],'把线上 A/B 当成唯一评测，或把离线高分当成生产质量保证。',['bench','agentsdk'])]},
      safety:{no:'08',title:'安全、权限与治理',en:'Safety, Authorization and Governance',color:'var(--orange)',intro:'当 Agent 读取私有资料或执行写操作，安全问题会从“模型说错话”升级为数据泄露和真实副作用。优秀答案需覆盖不可信输入、身份、最小权限、工具约束、审批、审计和隐私。',ask:'你能否把安全控制放在模型外部的执行边界，而不是只依赖一段“请遵守规则”的提示词？',refs:['mcp','agentsdk','anth'],questions:[
        Q('injection','如何防御提示词注入？','高级','提示词注入是指不可信内容试图改变模型行为，例如网页、邮件、文档或工具返回中出现“忽略之前指令”。根本原则是区分指令与数据，并在模型外部执行权限和安全控制。',['<b>信任分层：</b>系统指令、开发者策略、用户请求、外部文档和工具返回应有不同信任级别；外部内容只作为数据，不应拥有改写策略的权限。','<b>最小化暴露：</b>按任务和权限选择资料，不把无关密钥、内部策略或全部上下文放入模型输入。','<b>工具防线：</b>执行层独立校验身份、参数和业务规则；模型即使被诱导，也不能越权执行。','<b>检测与响应：</b>对可疑指令、数据外传和高风险工具调用进行分类、阻断、人工确认和审计，并用攻击样本回归测试。'],'<b>记忆点：</b>“不可信内容是数据，不是命令；模型可被诱导，权限不能被诱导。”',['不可信网页或文档','标记为数据并限制上下文','模型提出意图','执行层独立授权、校验或拒绝'],['过滤关键词够吗？','RAG 文档里有恶意指令怎么办？','如何测试注入防护？'],'只说“在 system prompt 写不要被注入”，没有信任分层、工具约束和测试。',['mcp','agentsdk']),
        Q('authorization','Agent 的工具权限如何设计？','高级','授权（authorization）回答“这个身份在当前任务下能否做此动作”。Agent 应使用最小权限和短期凭据，执行层根据用户、租户、资源、动作、金额/风险和审批状态进行判断。',['<b>身份传递：</b>明确 Agent 是代表谁行动；使用用户身份委派或受限服务身份，不使用全局超级密钥。','<b>策略判断：</b>在每次敏感调用时核验主体、资源、动作和上下文；读、写、删除、转账等权限应分级。','<b>临时凭据：</b>凭据短期、范围受限、可撤销，避免将密钥放入提示词、模型输出或普通日志。','<b>高风险动作：</b>要求确认/审批、幂等键、额度、白名单和完整审计；失败默认拒绝而非默认放行。'],'<b>记忆点：</b>“谁在做、对什么做、能做什么、做多大、谁批准，都要在执行层回答。”',['用户或服务身份','策略评估与最小权限','工具调用受控执行','审计、撤销或审批'],['MCP 会自动解决授权吗？','如何做多租户隔离？','为什么需要幂等键？'],'把 API key 当成完整权限模型，或让模型根据自然语言自行判断能否执行。',['mcp','agentsdk']),
        Q('privacyaudit','如何处理敏感数据、日志和审计？','中级','隐私关注哪些数据可以收集、使用、保留和删除；审计关注谁在何时基于什么做了什么。两者都需要数据分类、最小化、脱敏、访问控制和保留策略。',['<b>数据最小化：</b>只取完成当前任务必要的数据；检索和上下文构造先做权限过滤和脱敏。','<b>日志策略：</b>记录足以排查的任务标识、版本、结果摘要和决策，不默认保存完整提示词、文档原文或密钥。','<b>访问与保留：</b>对原始证据、Trace、记忆和导出分别设置访问控制、保留期、删除与导出流程。','<b>审计可用性：</b>高风险动作记录身份、授权依据、参数摘要、审批与结果，支持事后复盘。'],'<b>记忆点：</b>“少收、少传、少存；该记的动作要能追溯，敏感原文不应到处复制。”',['数据分类','最小化与脱敏','受控处理和日志','审计、保留与删除'],['如何在调试和隐私间取舍？','向量库也需要权限吗？','用户要求删除记忆怎么办？'],'为了可观测性把全部输入和上下文原文永久写入日志。',['mcp','agentsdk'])]},
      system:{no:'09',title:'系统设计、运行时与成本',en:'System Design, Runtime and Cost',color:'var(--blue)',intro:'系统设计题要求把前面所有概念串起来：输入、身份、知识、模型、工具、状态、运行时、评测和治理。回答时先明确目标与约束，再分主链路、失败链路和运营链路。',ask:'你能否从一个业务目标出发，设计可落地、可观测、可恢复且可控成本的 Agent 系统？',refs:['rag','graph','agentsdk','anth'],questions:[
        Q('knowledgeassistant','请设计一个企业知识助手。','高级','企业知识助手的关键不是“接一个向量库”，而是让员工在权限范围内获得最新、可引用的资料，并在无法确定时恰当拒答或升级。',['<b>先问约束：</b>用户是谁、资料类型和更新频率、权限模型、是否允许写操作、可接受时延/成本、成功如何衡量。','<b>主链路：</b>认证 -> 权限过滤 -> 文档解析/索引 -> 混合检索与重排序 -> 上下文构造 -> 模型生成带引用答案。','<b>失败链路：</b>资料不足时追问或拒答；检索/模型/依赖故障时降级；高风险问题转专家。','<b>运营：</b>追踪检索与引用、离线评测、线上反馈、文档版本和索引版本、缓存与灰度发布。'],'<b>记忆点：</b>“企业知识助手先管谁能看什么，再管能不能答对；答案必须能回到证据。”',['身份与权限','解析、索引、检索与重排序','生成带引用答案','评测、监控、反馈与更新'],['多租户如何隔离？','文档更新如何生效？','如何减少幻觉？'],'直接从“选择某个向量数据库”开始，没有需求澄清、权限、无答案策略和指标。',['rag','graph']),
        Q('costlatency','如何优化 Agent 的成本和时延？','高级','优化先要分解成本和时延：检索、首 token、生成 token、工具调用、重试、外部服务、长上下文和多 Agent 通信。目标是在任务质量和风险不下降的前提下优化。',['<b>测量分解：</b>Trace 中记录每个模型调用的输入/输出 token、首 token 时延、工具耗时、检索耗时、重试次数和缓存命中。','<b>减少不必要工作：</b>路由简单任务到更小模型，缩短并压缩上下文，缓存稳定检索/工具结果，并行无依赖步骤。','<b>提升成功率：</b>工具模式和提示清晰、重排序更准、失败分类更好，能减少昂贵的重复循环。','<b>不能牺牲的项：</b>权限校验、关键验证和高风险审批不应为了快而绕过；优化后要重跑质量与安全评测。'],'<b>记忆点：</b>“先量出慢和贵在哪，再减无效 token、无效调用和无效重试；安全验证不能打折。”',['Trace 分解成本时延','路由、缓存、压缩与并行','质量和安全回归评测','灰度观察并固化策略'],['首 token 为什么慢？','何时适合模型路由？','缓存如何避免过期或越权？'],'只说“换更小模型”，不先定位瓶颈，也不评估质量和安全回归。',['graph','agentsdk','middle']),
        Q('degradation','Agent 的外部服务故障时怎样降级和恢复？','高级','外部模型、检索、工具和第三方系统都可能失败。可靠设计需要超时、重试分类、熔断、回退、幂等、状态保存和用户可理解的失败反馈。',['<b>故障分类：</b>区分瞬时网络错误、限流、认证失败、参数错误、业务拒绝和依赖不可用；不同类别采用不同动作。','<b>回退路径：</b>模型故障可切换备用模型；检索故障可明确提示暂不可引用；写工具故障保留待处理状态而非假装成功。','<b>状态与幂等：</b>长任务保存检查点；有副作用操作使用幂等键，恢复时避免重复执行。','<b>用户体验与运营：</b>说明已完成和未完成的部分，提供重试/人工接管；通过告警、熔断和事后复盘改善依赖韧性。'],'<b>记忆点：</b>“错误先分类，回退要诚实；状态可恢复，副作用可幂等。”',['请求进入','超时、错误分类','重试、回退、熔断或人工接管','保存状态、告警与恢复'],['哪些错误不应自动重试？','熔断后用户看到什么？','如何防止重试风暴？'],'工具失败后仍让模型编造成功结果，或对所有错误盲目重试。',['graph','agentsdk'])]},
      project:{no:'10',title:'应用落地与项目实践',en:'Applications and Project Practice',color:'var(--green)',intro:'项目题最怕“堆技术名词，缺少贡献和证据”。高分叙述要让面试官清楚听到：业务问题、你的责任、方案选择、关键取舍、结果指标、失败与改进。没有真实项目时，应使用明确标注的设计案例而非编造经历。',ask:'你能否用一个项目证明自己理解了为什么这样做、怎么验证、出问题时如何处理？',refs:['anth','graph','agentsdk','bench'],questions:[
        Q('projectintro','如何介绍一个 AI Agent 项目？','中级','项目介绍应以业务目标和个人贡献为主线，而不是按技术组件罗列。一个完整叙述至少包含问题、约束、方案、取舍、结果与反思。',['<b>业务起点：</b>说明谁在什么流程中遇到什么问题，成功指标是什么，例如人工处理时长、解决率、引用正确率或代码测试通过率。','<b>你的贡献：</b>明确你负责的模块和决策，例如检索链路、工具契约、评测集、Trace 或权限设计。','<b>方案与取舍：</b>用一张主链路讲清模型、知识、工具、流程和人工节点，并解释为什么不选更复杂方案。','<b>结果与反思：</b>给出真实指标或明确说明尚无线上数据；说一个失败案例、归因和后续改进，比只报成功更可信。'],'<b>记忆点：</b>“问题 - 责任 - 方案 - 取舍 - 证据 - 反思。”',['业务问题与指标','个人负责的设计','上线或验证结果','失败复盘与下一步'],['你最难的决策是什么？','指标怎么定义和采集？','如果重做一次会改什么？'],'从“我用了 LangChain、向量库、GPT”开始，听不出业务价值、个人贡献和结果。',['anth','graph']),
        Q('frameworkchoice','如何选择 Agent 框架，什么时候自建编排？','高级','框架的价值是提供状态、图编排、工具适配、持久化、可观测性和常见模式；代价是抽象层、迁移成本和调试难度。选择应由运行需求和团队能力决定，而非流行度。',['<b>评估维度：</b>是否需要长运行状态、检查点、并发图、人工中断、多 Agent、Tracing、部署与团队已有生态。','<b>使用框架：</b>当这些通用能力能节省大量工程并且团队理解底层行为时，框架是加速器。','<b>自建编排：</b>当流程很小、路径明确、强定制、依赖简单或框架抽象阻碍调试时，直接使用模型 API 和少量状态机可能更合适。','<b>避免锁定：</b>把业务工具契约、评测、领域技能和状态模型与框架 API 适度解耦，保留迁移和测试能力。'],'<b>记忆点：</b>“框架买的是通用运行能力，不是智能；流程小而确定，直接写更清楚。”',['需求与团队约束','选择框架能力或轻量自建','实现可观测和测试','评估维护与迁移成本'],['LangGraph 和 AutoGen 的侧重点？','不用框架怎么做状态恢复？','怎样避免框架锁定？'],'只用“某框架更流行”解释选择，不谈状态、可观测性、抽象代价和团队能力。',['anth','graph','autogen']),
        Q('incident','线上 Agent 对某个客户表现异常，你如何排查？','高级','异常排查要先止损，再基于 Trace 和版本信息定位，再修复并回归验证。优秀回答会避免在没有证据时盲目改提示词。',['<b>先控制影响：</b>确认风险等级；暂停高风险工具、降级为只读/人工流程或回滚到稳定版本，并保留现场证据。','<b>收集关联信息：</b>任务和会话 ID、用户/租户、模型/提示/索引/工具版本、Trace、错误码、权限和近期发布变更。','<b>分层归因：</b>检查输入或注入、检索证据、上下文构造、模型输出、工具参数、下游依赖与授权策略。','<b>修复闭环：</b>最小化改动，加入复现样本和回归评测，灰度恢复，记录根因、监控项和预防措施。'],'<b>记忆点：</b>“先止损，再取证；按链路归因；修复要回归，恢复要灰度。”',['异常告警','降级或停止高风险动作','Trace 与版本分层定位','修复、回归、灰度和复盘'],['如何确定是否是提示词问题？','没有完整 Trace 怎么办？','如何与客户沟通？'],'一上来改提示词或换模型，没有止损、证据、版本比对和回归测试。',['graph','agentsdk','bench'])]}
    };

    topics.rag.questions.push(Q('graphrag','什么是知识图谱与 GraphRAG，什么时候值得引入？','高级','知识图谱以实体、关系和出处组织结构化事实；GraphRAG 在检索阶段将关系路径、局部子图与文本证据结合。它解决的是“关系本身是问题关键”的多跳检索，不是向量检索的通用替代品。',['<b>先区分对象：</b>文档与 Wiki 是原始知识源；向量索引擅长语义近邻；图谱表达实体关系、路径和约束。三者可以组合。','<b>适用判断：</b>当问题需要跨多个对象追溯依赖、归属、影响范围或多跳关系，且这些关系可维护、可验证时，图谱更有价值。','<b>实现链路：</b>保留来源、版本和权限；抽取并消歧实体关系；按问题检索受限子图和文本证据；最终回答回链原文。','<b>工程取舍：</b>图谱构建、更新、消歧和质量治理成本高。简单文档问答先把分段、混合检索、重排序和引用做好。'],'<b>记忆点：</b>“向量找相近，图谱找关系，GraphRAG 找到关系后仍要回原文取证。”',['问题中的实体与关系条件','权限过滤后的图谱和文本检索','子图路径与原文证据重排','带出处回答或明确无法确定'],['如何处理实体同名？','图谱关系怎样保持最新？','GraphRAG 如何评测？'],'把知识图谱说成“换一种向量数据库”，或只展示关系路径而不给原始证据。',['rag','graph']));
    topics.memory.questions.push(Q('memoryprofile','如何设计记忆类型与用户画像，同时保护隐私？','高级','记忆应按用途区分：工作记忆服务当前任务，情景记忆保留可复盘经历，语义记忆保存已验证的稳定事实，用户画像仅保存经允许且确有任务价值的偏好或约束。设计目标是最小化而非尽量多记。',['<b>先做分类：</b>给每条候选信息标注用途、来源、时间、置信度、敏感级别和保留规则，避免把任务状态、事实和偏好混成聊天记录。','<b>写入门槛：</b>只写入稳定、可复用、来源可靠且业务必要的信息；模型推断的偏好应经用户确认或多次证据验证。','<b>读取控制：</b>按当前任务、用户/租户、权限、相关性、时效和 token 预算筛选；用户画像不应默认进入每一次上下文。','<b>治理闭环：</b>提供查看、更正、删除和保留期策略；删除要覆盖主库、索引、缓存与导出流程，并保留必要审计。'],'<b>记忆点：</b>“先分用途，再定写入；按需读取，能记也能忘。”',['候选信息','分类、授权与写入判断','按任务最小化检索','更正、删除与审计'],['情景记忆和 Trace 有何不同？','如何防止跨用户记忆泄露？','用户画像何时需要显式同意？'],'把所有历史对话直接塞入向量库，或把模型猜测当作稳定用户事实。',['memgpt','middle','agentsdk']));
    topics.tools.questions.push(Q('mcparchitecture','MCP 的 Client、Server、Tools、Resources、Prompts 分别是什么？','中级','MCP Client 是使用能力的模型应用，MCP Server 是暴露能力的一方。Tool 表示可调用动作，Resource 表示可读取内容，Prompt 表示可复用提示模板。协议统一的是交互方式，不是业务授权。',['<b>角色：</b>Client 建立连接、发现能力并发起请求；Server 声明支持的能力并连接后端系统。一个应用可以连接多个 Server。','<b>对象边界：</b>Tool 有参数和结果，可能产生副作用；Resource 提供可读取数据；Prompt 提供参数化模板。不要把三者都叫“插件”。','<b>安全：</b>认证确认连接方身份；授权决定当前用户可见和可调用的能力；每次工具执行仍要校验参数、策略与审批。','<b>工程价值：</b>将客户端与系统接入方式解耦，能力可以发现、版本化和审计；但服务端能力变化要做兼容和回归测试。'],'<b>记忆点：</b>“Client 来用，Server 来供；Tool 做事，Resource 给料，Prompt 给模板；协议不等于授权。”',['Client 建立受认证连接','Server 声明能力目录','按对象类型读取或调用','执行层授权、校验与审计'],['MCP 和 Function Calling 的关系？','Resource 为什么也需要权限？','Prompt 能否覆盖系统指令？'],'只说“MCP 就是插件协议”，没有说明 Client/Server、三类对象和执行授权。',['mcp','agentsdk']));
    topics.tools.questions.push(Q('executionchannels','API、代码执行与浏览器自动化如何选择和治理？','高级','三类通道都把模型意图转为真实动作，但可靠性与风险不同：稳定业务操作优先 API，计算与转换使用沙箱代码，缺少 API 或必须理解页面时才用浏览器。共同底线是结构化契约、最小权限、结果确认和审计。',['<b>选择顺序：</b>优先选择稳定、可版本化、可审计的 API；分析或文件转换放入隔离代码环境；浏览器自动化作为需要真实界面语义的受控补充。','<b>执行契约：</b>模型只能提出函数与参数；执行层独立检查身份、范围、参数、业务规则、额度和幂等键。','<b>隔离与权限：</b>代码和浏览器限制网络、文件、凭据、资源与可访问页面；页面存在按钮不代表可以执行该动作。','<b>真实确认：</b>工具返回或页面提示不等于业务完成。对写操作读取权威状态，记录任务 ID、结果和失败恢复路径。'],'<b>记忆点：</b>“能用 API 不点页面；能在沙箱不碰宿主；模型提议，系统校验，结果回读。”',['任务与风险判断','选择 API、沙箱代码或浏览器','执行层校验并受控运行','读取权威结果或交接异常'],['浏览器自动化为何更脆弱？','如何防止代码 Agent 读取密钥？','工具超时后为什么先查询再重试？'],'只比较“哪个更方便”，忽略接口稳定性、权限、副作用确认和失败恢复。',['toolformer','web','agentsdk']));
    topics.multiagent.questions.push(Q('supervisorcoord','如何设计主管 - 专家多智能体协作，避免变成消息转发？','高级','主管的职责是按目标、依赖、权限和预算分派工作，要求专家交付可验证的中间产物，并根据证据验收、补问、整合或升级。多智能体的价值来自职责与验证分离，不来自角色数量。',['<b>先确认必要性：</b>只有在任务可分、子任务确有不同工具或专业边界、产物可验收时才引入专家；简单任务先用单 Agent。','<b>定义任务契约：</b>每个子任务明确输入、交付格式、证据要求、权限、时限、成本预算和停止条件，避免只传一段模糊自然语言。','<b>结构化通信：</b>专家回传结论、证据、置信度、假设和未解决项；主管检测冲突并要求补证或交给独立验证者。','<b>验收与治理：</b>主管按成功标准、规则和外部证据验收；关键动作仍经授权与审批，并记录父子任务 Trace。'],'<b>记忆点：</b>“先定交付，再派专家；结论带证据，主管做验收，不做传话。”',['总目标、预算与成功条件','主管分派结构化子任务','专家回传证据与状态','主管验证、整合、升级或停止'],['何时不该用 Supervisor？','共享状态如何处理冲突？','专家结论矛盾时怎么办？'],'只描述“一个 Agent 管多个 Agent”，没有交付契约、证据要求、预算或最终验收。',['autogen','graph','a2a']));    topics.evaluation.questions.push(Q('versionrelease','如何把模型、提示词、索引和工具改动纳入版本、实验与发布管理？','高级','Agent 行为由多个组件共同决定，因此版本管理不能只记录模型名称。应将候选改动、组件版本、评测集、流量分配、上线指标和回滚决策关联起来，才能对效果和异常做可靠归因。',['<b>版本清单：</b>记录模型、提示词、知识源与索引、切分策略、工具模式、工作流、护栏、配置和评测集版本，以及它们的兼容关系。','<b>离线门槛：</b>新旧版本在固定任务、沙盒和评分规则下对比任务完成、过程正确、引用、安全、时延和成本；关键样本保留人工复核。','<b>线上验证：</b>通过影子、灰度或 A/B 分流观察真实收益和长尾失败，提前定义放量、停止与回滚阈值。','<b>闭环：</b>线上失败样本脱敏、标注和复核后回流评测集；回滚保留现场证据，修复后重新走回归和灰度。'],'<b>记忆点：</b>“改什么要可追，是否更好要对照，上线先小流量，失败回到题集。”',['候选改动与版本清单','离线回归与安全检查','灰度或 A/B 观测','放量、回滚与样本回流'],['评测集为什么也要版本化？','多项改动同时上线如何归因？','什么指标应触发立即回滚？'],'只看上线后的单次平均指标，无法知道是哪个组件、哪类任务或流量变化造成结果。',['bench','agentsdk','graph']));    topics.safety.questions.push(Q('approval','如何为 Agent 设计审批机制和人类把关？','高级','审批将高风险、低置信、例外或不可逆动作交给具备责任和权限的人。它不是“所有工作转人工”，而是在自动化链路中设置可解释、可审计、可恢复的责任关口。',['<b>定义触发条件：</b>按金额、影响范围、数据敏感性、法律合规、不可逆性、置信度和规则冲突制定明确策略；命中后先冻结副作用。','<b>构造审批包：</b>提供动作、参数、影响、风险、命中规则、证据、可选决定、截止时间和撤销方式；敏感内容按审批人权限过滤。','<b>回写与执行：</b>批准后重新校验对象状态、权限和额度，再携带幂等键执行；修改或拒绝都要回写原任务并通知相关方。','<b>异常与审计：</b>处理超时、撤销、并发修改和批准后的工具失败；记录谁在何时依据什么做了什么决定。'],'<b>记忆点：</b>“先冻结，再送证据；人做决定，系统再校验；每一步可追溯。”',['动作与风险策略判断','生成受权限控制的审批包','人工决定并回写任务','重新校验、执行、确认与审计'],['低置信与高风险如何区分？','审批超时怎么办？','批准后对象被修改如何处理？'],'把审批简化成一个“是否同意”按钮，缺少触发规则、证据、重新校验和结果确认。',['mcp','agentsdk','anth']));    topics.system.questions.push(Q('gatewaydelivery','模型网关、部署扩缩容和灰度发布各解决什么问题？','高级','模型网关统一治理模型服务访问；部署与扩缩容保障运行容量和故障恢复；灰度发布控制版本变更风险。三者共同解决“模型服务如何稳定、可控地进入生产”，但不替代 Agent 的业务决策。',['<b>模型网关：</b>在应用与模型服务之间统一处理身份、可用模型、配额、限流、重试、缓存、版本记录和用量统计；业务路由仍决定任务是否需要模型、检索或人工。','<b>生产部署：</b>将代码、配置、依赖、密钥、工具和状态存储作为整体交付；按并发、队列积压、GPU/CPU 等信号扩缩容，并预留容量与故障恢复策略。','<b>渐进发布：</b>用离线评测作为门槛，影子或小流量验证真实质量、时延、成本和安全，再按阈值扩大、暂停或回滚。','<b>可观测性：</b>关联模型版本、调用 Trace、限流和降级事件、容量指标与业务成功率；否则无法区分服务故障和 Agent 流程问题。'],'<b>记忆点：</b>“网关管服务访问，运行平台管承载恢复，灰度管变更风险；三者都要接到 Trace。”',['请求进入网关与策略校验','部署运行时、存储与队列','灰度观察质量和容量','放量、降级或回滚'],['网关路由与 Agent 路由有什么区别？','扩容为何不能只看 CPU？','备用模型如何做质量验证？'],'把网关、框架和部署混为同一个组件，或只谈扩容而不谈版本、质量与回滚。',['agentsdk','graph','anth']));    topics.project.questions.push(Q('officeagent','如何设计一个办公、客服或销售 Agent，并说明它的边界？','中级','这类 Agent 的核心价值是整理信息、生成可审阅草稿、辅助分类和受控更新，而不是替公司做无边界承诺。设计时应把资料准备、沟通生成、业务写入与人工责任分开。',['<b>澄清场景：</b>明确服务对象、允许读取的系统、是否允许对外发送或写 CRM、不可自动化的承诺、成功指标与人工接管条件。','<b>主链路：</b>按权限读取客户/工单/知识资料，组织带来源的上下文，生成草稿或建议，经过规则检查和责任人确认后再发送或写入。','<b>执行边界：</b>价格、合同、退款、投诉、敏感数据和高影响承诺需要规则、审批或人工确认；草稿与发送、建议与写入必须分离。','<b>评测与运营：</b>评估事实正确、来源覆盖、分类准确、人工修改率、解决率、时延与升级率；将纠正案例回流评测集。'],'<b>记忆点：</b>“先准备资料，再生成草稿；先人确认，再对外承诺；写入要回读。”',['用户请求或业务事件','权限过滤与资料准备','草稿、规则检查与人工确认','受控发送/写入、回读与评测'],['如何防止错误写入 CRM？','客服 Agent 为什么要区分建议与承诺？','哪些指标说明它真的节省人力？'],'只描述“接一个 LLM 自动回复客户”，没有资料权限、人工确认、写入边界和业务指标。',['agentsdk','web','anth']));
    Object.values(topics).forEach(topic=>topic.questions.forEach(question=>{question.steps=question.steps.map((label,index)=>[label,index===0?'从问题对象或触发条件开始':index===question.steps.length-1?'落到结果、验证或升级动作':'说明关键处理、判断或边界'])}));
    const params=new URLSearchParams(location.search);const key=topics[params.get('topic')]?params.get('topic'):'foundation';const topic=topics[key];let active=topic.questions.find(q=>q.id===params.get('question'))||topic.questions[0];document.documentElement.style.setProperty('--accent',topic.color);document.title=`${topic.title} | AI Agent 面试知识图谱`;
    const esc=value=>value.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const reff=keys=>keys.map(k=>`<li><a href="${refs[k][1]}" target="_blank" rel="noreferrer">${refs[k][0]}</a></li>`).join('');
    const topicOrder=['foundation','rag','memory','agent','tools','multiagent','evaluation','safety','system','project'];
    const beginnerTopicMap={foundation:'foundation',rag:'context',memory:'improvement',agent:'core',tools:'capabilities',multiagent:'orchestration',evaluation:'evaluation',safety:'governance',system:'runtime',project:'applications'};
    const nav=document.getElementById('nav');topicOrder.forEach(id=>{const item=topics[id];const a=document.createElement('a');a.href=`questions.html?topic=${id}`;a.innerHTML=`${item.no} ${item.title}<small>${item.en}</small>`;if(id===key)a.setAttribute('aria-current','page');nav.append(a)});
    const content=document.getElementById('content');
    function setUrl(){history.replaceState({},'',`questions.html?topic=${key}&question=${active.id}`)}
    function renderAnswer(){const q=active;const flow=q.steps.map((x,i)=>`<article class="step"><span class="letter">${String.fromCharCode(65+i)}</span><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></article>`).join('');document.getElementById('answer').innerHTML=`<div class="answer-main"><p class="q-label">${q.level} / 高频核心题</p><h3>${esc(q.title)}</h3><p class="principle">${esc(q.principle)}</p><ol class="answer-list">${q.points.map(p=>`<li>${p}</li>`).join('')}</ol><p class="memory"><b>记忆点：</b>${q.memory.replace(/^<b>记忆点：<\/b>/,'')}</p></div><aside class="answer-side"><h4>面试官常见追问</h4><p>把回答收在一条可验证的主链路后，再选择下面的追问展开。不要把所有细节一次性倒出来。</p><div class="side-block"><strong>追问方向</strong><span>${q.follow.join(' · ')}</span></div><div class="side-block"><strong>避免这样回答</strong><span>${q.avoid}</span></div><div class="side-block"><strong>原始资料</strong><ul class="refs">${reff(q.evidence)}</ul></div></aside>`;document.getElementById('diagram').innerHTML=`<div class="diagram-inner">${flow}</div><div class="caption">答题图解：用“输入/触发 -> 决策或处理 -> 验证 -> 结果或升级”的链路组织口头回答，面试官更容易看到你的系统意识。</div>`;document.querySelectorAll('.question-tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.q===q.id)));setUrl()}
    function render(){content.innerHTML=`<header><p class="eyebrow">${topic.no} / ${topic.en}</p><h1>${topic.title}<span>${topic.en}</span></h1><p class="intro">${topic.intro}</p><p class="interviewer"><b>这组题主要考察：</b>${topic.ask}</p><p class="counterpart">对应初学者说明：<a href="../learn/concepts.html?topic=${beginnerTopicMap[key]}">查看「${topic.title}」的结构与图解</a></p></header><section class="section"><div class="head"><div><p class="eyebrow">Question map</p><h2>至少三道必练题</h2></div><p class="note">每个主题至少包含一道原理题、一道取舍题和一道生产题；关键主题会补充更多问题。选择问题后，下方会切换完整答题结构。</p></div><div class="question-tabs">${topic.questions.map((q,i)=>`<button class="question-tab" type="button" data-q="${q.id}" aria-pressed="false"><small>${String(i+1).padStart(2,'0')} / ${q.level}</small><strong>${esc(q.title)}</strong></button>`).join('')}</div></section><section class="section"><div class="head"><div><p class="eyebrow">Answer points</p><h2>原理 + 答题点 + 记忆点</h2></div><p class="note">四条答题点对应“定义、机制、取舍、生产”。根据面试时间压缩或展开，而不是机械背诵。</p></div><div class="answer" id="answer"></div></section><section class="section"><div class="head"><div><p class="eyebrow">Diagram</p><h2>用流程图把答案讲清</h2></div><p class="note">每张图都对应当前问题的因果链。若能不看文字复述图中的四步，说明你已掌握回答骨架。</p></div><div class="diagram" id="diagram"></div></section><section class="section"><div class="head"><div><p class="eyebrow">Follow-up</p><h2>追问与误区</h2></div><p class="note">追问通常从“为什么”“什么时候不适用”“如何验证”“线上出错怎么办”四个方向展开。</p></div><div class="follow"><div><strong>可能追问</strong><ul id="followups"></ul></div><div><strong>常见失分点</strong><ul id="avoid"></ul></div></div></section><section class="section"><div class="head"><div><p class="eyebrow">Topic sources</p><h2>本主题参考资料</h2></div><p class="note">建议准备面试时先读原始资料的摘要和概览，再回到问题页做口头练习。</p></div><ul class="refs">${reff(topic.refs)}</ul></section>`;document.querySelectorAll('.question-tab').forEach(b=>b.addEventListener('click',()=>{active=topic.questions.find(q=>q.id===b.dataset.q);renderAnswer();document.getElementById('answer').scrollIntoView({behavior:'smooth',block:'start'})}));renderAnswer();const f=document.getElementById('followups');active.follow.forEach(x=>{const li=document.createElement('li');li.textContent=x;f.append(li)});const a=document.getElementById('avoid');const li=document.createElement('li');li.textContent=active.avoid;a.append(li)}
    function renderFollowups(){const followups=document.getElementById('followups');const avoid=document.getElementById('avoid');if(!followups||!avoid)return;followups.replaceChildren(...active.follow.map(item=>{const li=document.createElement('li');li.textContent=item;return li}));const li=document.createElement('li');li.textContent=active.avoid;avoid.replaceChildren(li)}
    const baseRenderAnswer=renderAnswer;
    let firstAnswerRender=true;
    renderAnswer=function(){baseRenderAnswer();if(!firstAnswerRender)renderFollowups();firstAnswerRender=false};
    render();
  </script>
