<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI Agent 知识图谱的模块下钻页。每个模块含概述、结构关系、子模块图解、术语解释和研究来源。">
  <title>AI Agent 模块下钻</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f5f7f1; --ink: #18231d; --muted: #5f6b63; --line: #ced7ce;
      --surface: #ffffff; --soft: #eef3ed; --green: #0b725a; --teal: #007f83;
      --orange: #d9672c; --plum: #7854a3; --blue: #256da3; --rose: #c44b63;
      --shadow: 0 10px 28px rgba(23, 48, 37, .09);
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#101713; --ink:#edf4ee; --muted:#aab9ad; --line:#34463a; --surface:#17231c; --soft:#1c2b22; --green:#4cc4a2; --teal:#4ac5c5; --orange:#ff9a62; --plum:#c7a4ff; --blue:#78bbef; --rose:#ff9aae; --shadow:0 10px 28px rgba(0,0,0,.26); }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; min-width:320px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.62; }
    a { color:inherit; text-underline-offset:3px; }
    button { font:inherit; cursor:pointer; }
    .shell { width:min(1280px,calc(100% - 36px)); margin:0 auto; }
    .top { border-bottom:1px solid var(--line); background:var(--surface); }
    .top-inner { display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:16px; color:var(--muted); font-size:12px; }
    .back { flex:0 0 auto; color:var(--green); font-weight:800; text-decoration:none; }
    .global-nav { display:flex; flex:1 1 auto; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 16px; }
    .global-nav a { color:var(--muted); font-size:12px; font-weight:700; text-decoration:none; }
    .global-nav a:hover,.global-nav a[aria-current="page"] { color:var(--green); text-decoration:underline; text-decoration-thickness:2px; }
    .doc-meta { text-align:right; }
    .layout { display:grid; grid-template-columns:218px minmax(0,1fr) 210px; gap:28px; padding:34px 0 64px; }
    .module-nav { position:sticky; top:20px; align-self:start; padding-right:18px; border-right:1px solid var(--line); }
    .module-nav h2 { margin:0 0 10px; font-size:14px; }
    .module-nav p { margin:0 0 14px; color:var(--muted); font-size:12px; }
    .nav-list { margin:0; padding:0; list-style:none; }
    .nav-list a { display:block; padding:8px 8px 8px 10px; border-left:3px solid transparent; color:var(--muted); font-size:13px; text-decoration:none; }
    .nav-list a:hover, .nav-list a[aria-current="page"] { border-color:var(--accent); background:var(--soft); color:var(--ink); font-weight:800; }
    .nav-list small { display:block; color:var(--muted); font-size:10px; font-weight:400; }
    .component-nav { position:sticky; top:20px; align-self:start; padding-left:16px; border-left:1px solid var(--line); }
    .component-nav h2 { margin:0 0 8px; font-size:14px; }
    .component-nav p { margin:0 0 12px; color:var(--muted); font-size:12px; }
    .component-nav-list { display:grid; gap:6px; }
    .component-nav-button { width:100%; min-height:68px; padding:10px 11px; border:1px solid transparent; border-left:3px solid transparent; background:transparent; color:var(--muted); text-align:left; }
    .component-nav-button:hover,.component-nav-button:focus-visible,.component-nav-button[aria-pressed="true"] { border-color:var(--line); border-left-color:var(--accent); background:var(--soft); color:var(--ink); outline:0; }
    .component-nav-button span { display:block; margin-bottom:2px; color:var(--accent); font-size:10px; font-weight:800; }
    .component-nav-button strong { display:block; font-size:13px; line-height:1.24; }
    .component-nav-button small { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
    .content { min-width:0; }
    .crumb { margin:0 0 12px; color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; }
    h1 { max-width:860px; margin-bottom:13px; font-size:clamp(32px,5vw,54px); line-height:1.08; letter-spacing:0; }
    h1 span { display:block; margin-top:7px; color:var(--muted); font-size:14px; font-weight:500; letter-spacing:0; }
    .intro { max-width:850px; margin:0; color:var(--muted); font-size:16px; }
    .question { margin:20px 0 0; padding:12px 14px; border-left:4px solid var(--accent); background:var(--soft); font-size:13px; }
    .question b { color:var(--accent); }
    .counterpart { margin:12px 0 0; color:var(--muted); font-size:13px; }
    .counterpart a { color:var(--accent); font-weight:800; }
    .section { padding:38px 0; border-top:1px solid var(--line); }
    .section:first-of-type { margin-top:34px; }
    .section-head { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,360px); align-items:end; gap:20px; margin-bottom:20px; }
    .eyebrow { margin:0 0 6px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .section h2 { margin:0; font-size:clamp(23px,3.3vw,34px); line-height:1.16; }
    .section-note { margin:0; color:var(--muted); font-size:13px; }
    .relation { overflow:auto; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .relation svg { display:block; min-width:700px; width:100%; height:auto; }
    .rel-link { fill:none; stroke:var(--line); stroke-width:2; }
    .rel-link.main { stroke:var(--accent); stroke-width:3; }
    .rel-node rect { fill:var(--surface); stroke:var(--accent); stroke-width:2; rx:10; }
    .rel-node.center rect { fill:var(--soft); stroke-width:3; }
    .rel-node text { fill:var(--ink); font-family:Inter,"PingFang SC",sans-serif; font-size:14px; font-weight:800; text-anchor:middle; }
    .rel-node .minor { fill:var(--muted); font-size:10px; font-weight:500; }
    .relation-caption { padding:12px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .structure-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .structure-list div { padding:14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); }
    .structure-list strong { display:block; margin-bottom:3px; color:var(--accent); font-size:12px; }
    .structure-list span { color:var(--muted); font-size:12px; }
    .component-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .component-button { min-height:150px; padding:18px; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); color:var(--ink); text-align:left; }
    .component-button:hover, .component-button:focus-visible, .component-button[aria-pressed="true"] { background:var(--soft); outline:0; }
    .component-button[aria-pressed="true"] { box-shadow:inset 4px 0 var(--accent); }
    .component-number { display:block; margin-bottom:9px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.08em; }
    .component-button strong { display:block; margin-bottom:4px; font-size:17px; line-height:1.2; }
    .component-button small { display:block; color:var(--muted); font-size:11px; }
    .detail { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr); border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .detail-main { padding:30px; border-right:1px solid var(--line); }
    .detail-side { padding:30px; background:var(--soft); }
    .detail-label { margin:0 0 8px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .detail h3 { margin-bottom:9px; font-size:28px; line-height:1.15; }
    .term { color:var(--muted); font-size:14px; font-weight:500; }
    .definition { margin-bottom:18px; color:var(--muted); font-size:14px; }
    .visual-title { margin:18px 0 9px; font-size:13px; }
    .pipeline { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .step { min-width:110px; flex:1 1 120px; padding:12px; border-top:3px solid var(--accent); background:var(--soft); font-size:12px; font-weight:800; }
    .step small { display:block; margin-top:3px; color:var(--muted); font-size:10px; font-weight:500; }
    .flow-arrow { color:var(--accent); font-weight:900; }
    .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
    .quick { padding:12px; border-left:3px solid var(--accent); background:var(--soft); }
    .quick b { display:block; margin-bottom:3px; font-size:12px; }
    .quick span { color:var(--muted); font-size:12px; }
    .detail-side h4 { margin:0 0 10px; font-size:16px; }
    .detail-side p { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .detail-side p b { color:var(--ink); }
    .side-block { padding-top:14px; border-top:1px solid var(--line); }
    .side-block + .side-block { margin-top:14px; }
    .side-block strong { display:block; margin-bottom:4px; font-size:13px; }
    .side-block span { color:var(--muted); font-size:12px; }
    .refs { display:flex; flex-wrap:wrap; gap:8px 14px; margin:0; padding:0; list-style:none; }
    .refs a { color:var(--accent); font-size:12px; font-weight:800; }
    .other-link { display:inline-block; margin-top:18px; color:var(--accent); font-size:13px; font-weight:800; }
    .foundation-primer { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr); border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .foundation-primer-main,.foundation-primer-side { padding:26px; }
    .foundation-primer-main { border-right:1px solid var(--line); }
    .foundation-primer h3 { margin:0 0 8px; font-size:22px; }
    .foundation-primer p { margin:0; color:var(--muted); font-size:13px; }
    .model-cast { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); margin-top:20px; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .model-cast div { padding:13px 10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); }
    .model-cast b { display:block; margin-bottom:4px; color:var(--accent); font-size:12px; }
    .model-cast span { display:block; color:var(--muted); font-size:11px; line-height:1.45; }
    .foundation-primer-side { background:var(--soft); }
    .foundation-primer-side ol { margin:12px 0 0; padding-left:18px; color:var(--muted); font-size:13px; }
    .foundation-primer-side li + li { margin-top:8px; }
    .talk-deep-dive { margin-top:38px; padding-top:38px; border-top:1px solid var(--line); scroll-margin-top:18px; }
    .talk-intro { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,320px); gap:20px; padding:24px; border-left:4px solid var(--accent); background:var(--soft); }
    .talk-kicker { margin:0 0 6px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .talk-intro h3 { margin:0 0 7px; font-size:26px; line-height:1.14; }
    .talk-intro p { margin:0; color:var(--muted); font-size:13px; }
    .talk-backlink { align-self:end; color:var(--accent); font-size:13px; font-weight:800; }
    .talk-stage { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr); margin-top:20px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .talk-story { padding:26px; border-right:1px solid var(--line); }
    .talk-story h4,.talk-console h4,.talk-memory h4 { margin:0 0 10px; font-size:18px; }
    .talk-bubble { margin:14px 0; padding:13px 15px; border-left:3px solid var(--accent); background:var(--soft); color:var(--ink); font-size:14px; font-weight:700; }
    .talk-cast { display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px; align-items:start; padding:14px 0; border-top:1px solid var(--line); }
    .talk-badge { display:grid; width:34px; height:34px; place-items:center; border:1px solid var(--accent); color:var(--accent); font-size:12px; font-weight:800; }
    .talk-cast strong { display:block; margin-bottom:2px; font-size:14px; }
    .talk-cast span { display:block; color:var(--muted); font-size:12px; }
    .talk-console { padding:26px; background:var(--soft); }
    .talk-switch { display:grid; gap:8px; margin-top:15px; }
    .talk-switch button { min-height:46px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid transparent; background:var(--surface); color:var(--muted); text-align:left; font-size:12px; font-weight:800; }
    .talk-switch button:hover,.talk-switch button:focus-visible,.talk-switch button[aria-pressed="true"] { border-left-color:var(--accent); color:var(--ink); outline:0; }
    .talk-answer { min-height:96px; margin:14px 0 0; padding:13px; border-top:3px solid var(--accent); background:var(--surface); color:var(--muted); font-size:13px; }
    .talk-answer b { display:block; margin-bottom:4px; color:var(--ink); }
    .talk-memory { display:grid; grid-template-columns:150px minmax(0,1fr); gap:22px; align-items:center; margin-top:18px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .talk-memory-tag { padding:14px; border-top:3px solid var(--accent); background:var(--soft); color:var(--ink); font-size:16px; font-weight:800; text-align:center; }
    .talk-memory p { margin:0; color:var(--muted); font-size:13px; }
    .talk-footnote { margin:14px 0 0; color:var(--muted); font-size:12px; }
    .llm-route { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:20px; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .llm-route a,.llm-route div { position:relative; min-height:82px; padding:13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); color:var(--muted); text-decoration:none; }
    .llm-route a::after,.llm-route div::after { content:"->"; position:absolute; right:-10px; top:50%; z-index:2; color:var(--plum); font-weight:900; }
    .llm-route > :last-child::after { display:none; }
    .llm-route a:hover { background:var(--soft); color:var(--ink); }
    .llm-route .current { border-top:3px solid var(--plum); background:var(--soft); color:var(--ink); }
    .llm-route span { display:block; margin-bottom:4px; color:var(--plum); font-size:11px; font-weight:800; }
    .llm-route strong { display:block; font-size:13px; line-height:1.3; }
    .deep-dive { margin-top:38px; padding-top:38px; border-top:1px solid var(--line); scroll-margin-top:18px; }
    .deep-lede { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,360px); gap:20px; padding:22px; border-left:4px solid var(--accent); background:var(--soft); }
    .deep-lede h3 { margin:0 0 7px; font-size:25px; line-height:1.16; }
    .deep-lede p,.deep-note,.deep-situation p { margin:0; color:var(--muted); font-size:13px; }
    .deep-backlink { align-self:end; color:var(--accent); font-size:13px; font-weight:800; }
    .deep-part { padding:32px 0; border-top:1px solid var(--line); }
    .deep-part-head { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,360px); align-items:end; gap:20px; margin-bottom:18px; }
    .deep-part-head h3 { margin:0; font-size:24px; line-height:1.16; }
    .deep-kicker { margin:0 0 6px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .deep-process { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .deep-step { position:relative; min-height:126px; padding:17px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); }
    .deep-step::after { content:"->"; position:absolute; right:-11px; top:50%; z-index:2; color:var(--accent); font-weight:900; }
    .deep-step:last-child::after { display:none; }
    .deep-step span { display:block; margin-bottom:7px; color:var(--accent); font-size:11px; font-weight:800; }
    .deep-step strong { display:block; font-size:14px; line-height:1.25; }
    .deep-connection { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .deep-connection div { padding:15px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--soft); }
    .deep-connection b { display:block; margin-bottom:4px; color:var(--accent); font-size:12px; }
    .deep-connection span { color:var(--muted); font-size:12px; }
    .deep-situation { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.8fr); border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .deep-situation-main,.deep-situation-side { padding:24px; }
    .deep-situation-main { border-right:1px solid var(--line); }
    .deep-situation-side { background:var(--soft); }
    .deep-situation h4 { margin:0 0 7px; font-size:19px; }
    .deep-situation b { color:var(--accent); }
    .llm-deep-dive { margin-top:32px; padding-top:32px; border-top:1px solid var(--line); scroll-margin-top:18px; }
    .mechanics-map { display:flex; flex-wrap:wrap; gap:8px 16px; padding:12px 0 0; border-top:1px solid var(--line); }
    .mechanics-map span { color:var(--plum); font-size:12px; font-weight:800; }
    .llm-lede { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,360px); gap:20px; padding:22px; border-left:4px solid var(--plum); background:var(--soft); }
    .llm-lede h3 { margin:0 0 7px; font-size:25px; line-height:1.16; }
    .llm-lede p { margin:0; color:var(--muted); font-size:13px; }
    .llm-backlink { align-self:end; color:var(--plum); font-size:13px; font-weight:800; }
    .llm-part { padding:32px 0; border-top:1px solid var(--line); }
    .llm-part-head { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,360px); align-items:end; gap:20px; margin-bottom:18px; }
    .llm-part-head h3 { margin:0; font-size:24px; line-height:1.16; }
    .llm-note { margin:0; color:var(--muted); font-size:13px; }
    .llm-kicker { margin:0 0 6px; color:var(--plum); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .llm-token-board,.llm-attention,.llm-control,.llm-boundaries { display:grid; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .llm-token-board { grid-template-columns:minmax(0,1fr) minmax(240px,.75fr); }
    .llm-token-main,.llm-token-side,.llm-attention-visual,.llm-attention-copy,.llm-control-main,.llm-control-side,.llm-do,.llm-dont { padding:26px; }
    .llm-token-main,.llm-attention-visual,.llm-control-main,.llm-do { border-right:1px solid var(--line); }
    .llm-token-side,.llm-attention-copy,.llm-control-side { background:var(--soft); }
    .llm-token-main h4,.llm-token-side h4,.llm-attention h4,.llm-control h4 { margin:0 0 7px; font-size:19px; }
    .llm-token-main p,.llm-token-side p,.llm-attention p,.llm-control p { color:var(--muted); font-size:13px; }
    .llm-tokens { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:23px; }
    .llm-token { padding:9px 12px; border-top:3px solid var(--plum); background:var(--soft); font-size:17px; font-weight:800; }
    .llm-token small { display:block; color:var(--muted); font-size:10px; font-weight:500; }
    .llm-arrow { color:var(--plum); font-weight:900; }
    .llm-fact { padding:11px 0; border-top:1px solid var(--line); }
    .llm-fact:first-of-type { border-top:0; }
    .llm-fact b { display:block; font-size:13px; }
    .llm-fact span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .llm-pipeline { overflow:auto; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .llm-pipeline-inner { display:flex; min-width:820px; align-items:stretch; }
    .llm-pipe { position:relative; flex:1; padding:20px 17px; border-right:1px solid var(--line); }
    .llm-pipe:last-child { border-right:0; }
    .llm-pipe::after { content:"->"; position:absolute; right:-11px; top:50%; z-index:2; color:var(--plum); font-weight:900; }
    .llm-pipe:last-child::after { display:none; }
    .llm-pipe .number { display:block; margin-bottom:8px; color:var(--plum); font-size:11px; font-weight:800; }
    .llm-pipe strong { display:block; margin-bottom:5px; font-size:15px; }
    .llm-pipe p { margin:0; color:var(--muted); font-size:12px; }
    .llm-attention { grid-template-columns:1fr .92fr; }
    .llm-sentence { position:relative; display:flex; flex-wrap:wrap; gap:10px; margin:48px 0 34px; padding-top:58px; }
    .llm-word { position:relative; padding:9px 12px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:800; }
    .llm-word.active { border-color:var(--plum); background:var(--soft); }

          C('planning','任务规划','Planning','将一个多步骤目标拆成依赖明确、可执行、可检查的小任务。计划可以是固定流程，也可以由模型动态提出，再受状态和规则约束。',['任务目标','子任务拆分','依赖与顺序','执行与修订'], '任务图或行动序列','计划不是最终答案；每一步必须能执行、能观察结果、能因失败而重排。','“做竞品研究”可拆为：定义范围 -> 搜集来源 -> 取证 -> 比较 -> 形成结论 -> 人工复核。'),
          C('routing','模型与能力路由','Model and Capability Routing','根据任务类型、风险、成本、语言、时延或上下文长度，选择合适的模型、工具、知识源或专门 Agent。',['请求特征','路由规则或分类','选择模型/工具/子 Agent','回收结果'], '更合适的执行路径','路由不是随机换模型；需要可解释的策略、回退路径和效果评测。','简单分类走低成本模型，复杂合同分析走强模型并启用检索，付款动作转人工确认。'),
          C('reflection','反思与纠错','Reflection','在观察到工具返回、测试结果或外部反馈后，检查刚才的计划或产物是否应修正。它是“基于反馈的再决策”，不是无限自我对话。',['执行结果','失败信号或评测','定位原因','修订计划或终止'], '更稳健的下一轮尝试','反思会消耗时间和 Token；应有次数上限，并优先使用客观反馈，如测试、规则校验或人工标注。','代码 Agent 跑测试失败后读取报错、缩小修改范围、重跑；连续失败则提交给开发者。'),
          C('loop','智能体执行循环','Agent Loop','把观察、判断、行动和结果检查组织成循环。循环的价值不在于“自动转得久”，而在于每一圈都向可验证目标靠近。',['读取状态','决定下一步','执行动作','观察与记录'], '完成、交接或安全停止','循环不是自主性的证明。没有停止条件、预算和权限约束的循环，只是更昂贵的迷路。','旅行助手反复查询航班，直到满足价格与时间约束；若无合适方案，返回候选而不是继续查到天亮。')
        ]
      },
      context: {
        no:'02', title:'知识检索与检索增强生成', english:'Knowledge Retrieval and RAG', color:'var(--teal)',
        intro:'这一层解决“模型怎样找到当前问题所需的外部事实”。知识库保存可共享的业务资料；检索增强生成把少量相关、最新、可引用的资料送入当前请求。记忆与上下文工程作为独立模块处理跨会话信息与窗口管理。',
        question:'怎样让 Agent 在需要时拿到正确资料，而不是把全部资料硬塞进提示词？', inbound:'文档、数据库、用户历史、当前对话', core:'解析、检索、选择、压缩、引用', outbound:'当前任务需要的有限证据与状态', guard:'权限过滤、时效性、引用、上下文预算',
        structure:[['知识库','业务事实的来源地；可以是文档、表、数据库、知识图谱或 API。'],['检索与重排序','从大量资料中先召回候选，再挑选最相关、权限正确的证据。'],['RAG','把少量证据连同来源送入模型，生成可追溯的回答。']], refs:['rag','selfrag','middle'],
        children:[
          C('knowledgebase','知识库','Knowledge Base','为检索或查询准备的业务资料集合。关键工作包括数据授权、解析、元数据、版本、分段、质量和更新流程。',['原始资料','解析、清洗、分段','索引与权限元数据','供查询与检索使用'], '可被正确检索的业务资料','把 PDF 堆进文件夹不等于知识库；若没有解析、来源、更新和访问控制，Agent 很难可靠使用。','制度文档按版本和生效日期入库，查询时先过滤部门与权限，再检索内容。'),
          C('knowledgegraph','知识源、知识图谱与 GraphRAG','Knowledge Sources, Knowledge Graph and GraphRAG','知识可以来自文档与 Wiki、业务数据库、数据仓库、向量索引或知识图谱。知识图谱用“实体 - 关系 - 证据”保留结构；GraphRAG 是在检索时结合这类关系结构和文本证据的方法。',['明确知识源与权限','抽取实体、关系与出处','按问题检索文本和相关子图','回到原始证据回答'], '带关系和出处的结构化证据','向量数据库擅长找语义相近片段，知识图谱擅长表达谁和谁有什么关系；GraphRAG 不是所有 RAG 都必须引入的组件。','查“某产品受哪份合规政策影响”时，图谱可沿“产品 -> 地区 -> 政策 -> 条款”找到关系，再回到条款原文确认。'),
          C('rag','检索增强生成','Retrieval-Augmented Generation, RAG','先从外部资料中检索与问题相关的内容，再将其连同来源提供给模型生成回答。它让知识更新和回答依据从模型参数中部分外移。',['用户问题','检索与重排序','选择少量证据','生成带引用的回答'], '基于来源的回答','RAG 不是保证正确的魔法。错分段、错检索、过期资料和模型误读都可能导致错误。','员工问报销额度：系统检索最新制度的相关条款，给出额度、适用条件和原文链接。'),
          C('chunking','分段与元数据','Chunking and Metadata','将原始资料按语义、标题、表格或段落切分为可检索单元，并附上来源、更新时间、权限和业务标签。分段决定召回粒度，是 RAG 质量的基础。',['原始资料','解析与语义分段','附加来源、权限、时间元数据','建立索引'], '可定位、可过滤的证据单元','只按固定字数切分容易拆散表格、定义和例外条款；分段策略必须随文档结构和评测结果调整。','报销制度按章节和条款切分，并保留部门、生效日期和原文链接。'),
          C('retrieval','召回、重排序与引用','Retrieval, Reranking and Citation','检索先从索引中广泛召回候选，再用关键词、向量、过滤或重排序筛选少量证据；最终回答应能回到具体来源。',['用户问题','混合召回与权限过滤','重排序、去重、选择证据','生成带引用的回答'], '可验证的资料选择','只看向量相似度可能召回“看起来像”但不适用的条款；时效、权限、版本和引用完整性都要评测。','员工询问差旅额度时，系统优先选择其部门当前生效的原文条款，而不是相似的旧制度。')
        ]
      },
      capabilities: {
        no:'05', title:'工具、技能与协议', english:'Tools, Skills and Protocols', color:'var(--orange)',
        intro:'语言模型会说明“想做什么”，能力扩展层负责安全、准确地把意图变成真实操作。技能封装可复用方法；工具调用执行函数或操作；MCP 统一应用与工具/资源的连接；连接器适配具体系统。',
        question:'如何让 Agent 真正办事，同时避免把每个外部系统接成一团难以维护的线？', inbound:'任务意图、结构化参数、权限上下文', core:'技能选择、参数校验、连接与执行', outbound:'工具结果、状态变化、证据与错误', guard:'模式校验、最小权限、确认、超时与幂等性',
        structure:[['技能','任务方法的可复用封装，通常含说明、步骤、模板和资源。'],['工具调用','执行某个明确动作，如查询、计算、写入或浏览。'],['互操作协议','MCP 标准化模型应用与工具资源的连接；连接器落地到具体系统。']], refs:['toolformer','mcp','agentsdk','anthropic'],
        children:[
          C('skill','技能','Skill','围绕一类任务封装的可复用能力单元，通常包括适用条件、步骤、提示模板、脚本、资料和输出要求。技能更像标准作业包，而不是单个 API。',['任务类型识别','读取技能说明','执行步骤与资源','产出标准结果'], '可重复的任务方法','技能不等于模型微调，也不等于一个按钮；它可以调用多项工具并包含业务判断流程。','“月度对账”技能规定：收集账单、清洗、计算、异常解释、生成报告和人工复核。'),
          C('toolcalling','工具调用','Tool Calling / Function Calling','模型输出符合预定模式的函数名与参数，由应用执行真实函数，再把结果返回模型或流程。关键是工具契约，而不是模型随意写一段命令。',['工具定义与参数模式','模型提出调用','应用校验并执行','返回结构化结果'], '可观察的外部动作','工具调用不等于让模型直接拥有系统权限；执行层必须验证参数、身份和业务规则。','查询库存工具只读；创建采购单工具需要金额上限和审批令牌。'),
          C('execution','API、代码与浏览器执行','API, Code and Browser Execution','Agent 的动作可落在业务 API、代码运行环境或浏览器操作上。三者都应通过受控工具执行：明确参数、限制权限、观察真实结果，并区分只读与有副作用的动作。',['选择执行通道','校验目标、参数与权限','在受控 API 或沙箱中执行','读取结果并确认真实状态'], '可验证的外部动作','浏览器自动化不等于可以绕过页面权限；代码执行也不等于可以读取宿主机文件或网络。','数据 Agent 在沙箱中运行统计代码；客服 Agent 用浏览器读取工单，再由审批后的 API 提交退款。'),
          C('mcp','模型上下文协议','Model Context Protocol, MCP','一种开放协议，用于让模型应用以标准方式发现和调用外部工具、读取资源、使用提示模板等。它定义连接和交互约定，不替代业务系统自身。',['MCP 客户端','能力发现','调用 Tools / 读取 Resources','返回标准化结果'], '可互换的工具与资源接入','MCP 不是“所有 AI 都自动互通”，也不是安全授权本身；服务器和客户端仍要处理身份、授权与信任。','IDE 通过 MCP 连接代码仓库、数据库或内部服务，不必为每个客户端各写一套私有接入协议。'),
          C('mcpobjects','MCP Client、Server 与三类能力','MCP Client, Server, Tools, Resources and Prompts','MCP Client 是发起连接并消费能力的模型应用；MCP Server 是暴露能力的一方。Server 可提供 Tools（可调用动作）、Resources（可读取内容）和 Prompts（可复用提示模板）；具体启用哪些能力取决于实现与授权。',['Client 建立受认证连接','Server 声明可用能力','Client 按模式读取或调用','Server 返回受控结果'], '可发现、可区分的外部能力','Tools 会产生或查询动作，Resources 提供数据，Prompts 提供模板；它们不是同一种对象，也都不能绕过业务授权。','桌面助手作为 Client 连到文件服务 Server：读文件走 Resource，写入审批单走 Tool，常用审阅格式可由 Prompt 提供。'),
          C('connector','连接器与插件','Connector and Plugin','面向某个具体系统的适配层。它把系统的认证方式、对象模型、API 限制和错误语义包装为 Agent 可理解的能力。',['系统 API 与鉴权','适配对象与错误','工具或资源暴露','Agent 使用'], '对外系统的可靠接口','连接器不是业务流程；它负责“连得上、看得懂、报错说得清”，流程仍由 Skill 或编排层负责。','CRM 连接器提供“查客户、更新联系人”，销售跟进流程由上层技能决定。')
        ]
      },
      orchestration: {
        no:'06', title:'多智能体协作', english:'Multi-Agent Collaboration', color:'var(--rose)',
        intro:'编排决定系统如何把多个步骤、工具和 Agent 组织起来。工作流适合稳定、可预测的路径；动态 Agent 适合开放式判断；多 Agent 适合职责可分、交付物可验收的复杂任务。',
        question:'什么时候该用固定流程，什么时候让 Agent 自主选择，什么时候值得引入多个 Agent？', inbound:'任务、状态、规则、可用能力', core:'流程控制、任务图、委派与交接', outbound:'有序的执行轨迹与可验收交付物', guard:'状态一致性、重试、超时、人工节点、成本预算',
        structure:[['工作流','程序事先规定主路径，适合合规、重复、依赖明确的任务。'],['状态与任务图','把任务拆成节点和依赖，使中断、恢复、并行和审计变得清楚。'],['多智能体协作','以明确角色、输入输出契约和验收标准分工，而不是让多个模型闲聊。']], refs:['anthropic','langgraph','autogen','survey'],
        children:[
          C('workflow','工作流','Workflow','由程序预先编排的步骤链或分支图。模型可以参与某些节点，但控制路径主要由工程逻辑决定。',['触发事件','固定步骤与条件分支','模型或工具节点','结果与归档'], '稳定、可预测的任务执行','工作流不是“低级 Agent”。对于规则清晰的流程，它通常更便宜、可测、可审计。','发票处理：上传 -> OCR -> 规则校验 -> 异常审核 -> 入账。'),
          C('stategraph','状态与任务图','State Machine and Task Graph','用显式状态、节点和边描述任务进度与依赖。它使系统知道“现在在哪、下一步允许去哪、失败后从哪恢复”。',['状态对象','节点与转移条件','持久化检查点','恢复或终止'], '可恢复、可审计的执行过程','任务图不是画图工具；每条边都应代表可以执行和验证的转移条件。','研究任务在“资料收集”失败后可重试该节点，而不是从“明确问题”重新开始。'),
          C('multiagent','多智能体协作','Multi-Agent System','让多个有不同职责或不同工具权限的 Agent 协同完成任务。常见模式有主管-专家、顺序交接、并行评审和辩论。',['总任务','分派子任务','共享最小必要产物','集成与验收'], '复杂任务的分工','多 Agent 不是能力加法。沟通、重复检索和错误传递会增加成本；简单问题先用单 Agent。','产品研究可分为市场搜集、技术评估、财务测算，最后由整合 Agent 生成带证据的对比。'),
          C('supervisor','主管调度与 Agent 通信','Supervisor and Agent Communication','主管（Supervisor）负责拆分目标、选择合适的子 Agent、设定交付格式与预算，并对结果做汇总或退回。Agent 通信应传递结构化任务、证据、状态和限制，而非只交换长段自然语言。',['总目标与约束','主管分派任务与交付契约','子 Agent 回传证据、状态和置信度','主管验收、追问或升级'], '可控的协作闭环','主管不等于“最强模型”；它需要明确的权限、预算、停止条件和验收标准，不能成为无边界的转发器。','市场、技术、财务三个 Agent 分别交付表格和引用；主管发现证据冲突时要求补证，而不是把三段结论直接拼在一起。'),
          C('handoff','交接与人工参与','Handoff and Human-in-the-loop','将任务、上下文、证据和责任从一个 Agent 转给另一个 Agent 或人。好的交接说明“已做什么、依据什么、还缺什么、为何升级”。',['升级条件','打包状态与证据','交给专责 Agent 或人','记录决定并继续'], '明确的责任转移','人工参与不是 Agent 失败；涉及高风险判断、例外情形或不可逆动作时，人工是系统设计的一部分。','退款金额超过阈值时，客服 Agent 提供摘要和证据，由人工批准后才执行。')
        ]
      },
      runtime: {
        no:'09', title:'系统设计、运行时与成本', english:'System Design, Runtime and Cost', color:'var(--blue)',
        intro:'系统设计把模型、知识、工具、状态和治理组合为可交付服务。运行时承载会话状态、工具执行、沙箱和异步消息；成本与时延则要求按任务选择模型、上下文和执行路径。',
        question:'怎样设计一个可持续运行、可恢复、可控成本且不扰乱生产系统的 Agent？', inbound:'请求、事件、任务状态、凭据与资源配额', core:'执行调度、状态保存、隔离、通信与成本控制', outbound:'可恢复运行、结构化日志、事件与结果', guard:'资源配额、网络隔离、身份、审计、故障恢复',
        structure:[['运行时','管理 Agent 生命周期、会话和工具调用，提供状态与并发控制。'],['执行隔离','在受控环境执行代码、浏览器或命令，限制文件、网络和资源。'],['通信与存储','事件队列、数据库、缓存和 A2A 等协议支撑异步协作与恢复。']], refs:['langgraph','autogen','a2a','aws','google','azure'],
        children:[
          C('runtime','智能体运行时','Agent Runtime','负责启动、暂停、恢复、终止 Agent，并管理会话、状态、工具调用和并发。它类似服务运行的调度器，而不是语言模型本身。',['请求或事件','加载状态与配置','执行 Agent 循环','保存检查点与结果'], '可持续的 Agent 生命周期','运行时不是某个框架的专有名词；无论自建还是托管，都需要处理状态、失败和资源。','长时间研究任务在网页抓取完成后保存检查点，稍后可从“证据归档”继续。'),
          C('sandbox','沙箱执行环境','Sandbox','将代码执行、浏览器操作或文件修改放入隔离环境，限制它能访问的网络、磁盘、凭据和计算资源。',['受限凭据与资源','执行脚本或浏览器','捕获输出与副作用','清理或快照'], '可控的外部执行','沙箱不是绝对安全；仍需最小权限、网络控制、命令策略、资源限制和人工审批。','数据分析 Agent 在临时容器中运行 Python，只挂载授权数据集，不可直接访问生产数据库。'),
          C('gateway','模型网关与流量治理','Model Gateway and Traffic Governance','模型网关在应用和多个模型服务之间统一处理鉴权、模型路由、配额、限流、重试、缓存、版本记录与用量统计。它让业务流程不必直接依赖每个模型供应方的私有接口。',['请求与身份进入','策略选择模型、区域或版本','限流、配额与失败回退','记录用量、质量与审计'], '受控的模型服务访问','模型网关不替代 Agent 的任务路由；网关管服务访问和治理，Agent 路由管当前任务应该使用什么能力。','同一摘要请求按租户配额走不同模型版本；某个服务限流时网关切换备用模型并记录降级。'),
          C('schedule','定时任务与事件触发','Scheduling and Event Triggers','定时任务按时间表启动周期性工作；事件触发器在文件入库、审批完成或状态变更后启动后续流程。两者都要避免重复执行，并能记录一次触发最终推进了哪条任务。',['时间表或业务事件','去重并创建任务','交给运行时或队列执行','记录结果、重试或人工处理'], '可追踪的自动启动','定时器不是可靠交付保证；任务执行仍需要持久状态、超时、幂等和失败告警。','每天凌晨检查制度是否有新版本；检测到更新后创建解析、索引和回归评测任务。'),
          C('event','事件与消息队列','Event and Message Queue','把任务提交、工具完成、人工回复等变成异步事件，帮助系统解耦、重试、削峰和追踪长任务。',['事件产生','排队与持久化','消费者处理','确认、重试或死信'], '可靠的异步任务推进','消息队列不负责业务正确性；消费者仍要处理重复消息、顺序和幂等性。','文件解析完成后发布事件，检索索引服务订阅处理，完成后再触发评测任务。'),
          C('storage','状态存储与缓存','State Storage and Cache','将会话、任务状态、检查点、工具结果和临时上下文保存到合适介质；缓存减少重复模型调用和检索。',['状态与结果','分类存储','过期与权限策略','按需读取或缓存命中'], '连续性与成本控制','缓存不能绕过权限或使用过期关键数据；必须把身份、版本、时效性纳入缓存键和失效策略。','同一政策问题的检索结果可短期缓存，但政策更新后立即失效。'),
          C('delivery','部署、扩缩容与发布','Deployment, Scaling and Release','把 Agent 从开发环境交付到生产，需要打包配置、管理依赖和密钥、按负载扩缩容，并通过灰度、回滚和变更记录控制发布风险。',['构建与配置校验','部署到受控环境','灰度放量与容量监测','回滚、复盘与版本归档'], '可恢复的生产交付','把代码部署成功不表示任务质量安全；发布门槛还需要评测、权限检查、容量预案与回滚条件。','先让 5% 的客服会话使用新检索版本，监测引用正确率和升级率，超过阈值即回滚。'),
          C('a2a','智能体对智能体协议','Agent2Agent Protocol, A2A','用于不同 Agent 或 Agent 系统之间发现能力、发送任务、流式返回进度、协作和交接的开放协议。',['发现远程 Agent','发送任务与上下文','进度与结果交换','完成、取消或升级'], '跨框架的 Agent 协作','A2A 不是 MCP 的替代：MCP 更常用于 Agent 接工具和资源，A2A 更常用于 Agent 找另一个 Agent 协作。','内部研究 Agent 通过 A2A 委派翻译任务给语言专长 Agent，并收到可跟踪的任务状态。')
        ]
      },
      governance: {
        no:'08', title:'安全、权限与治理', english:'Safety, Authorization and Governance', color:'var(--orange)',
        intro:'当 Agent 能读数据、调用工具、修改系统时，安全与治理不再是上线前的检查表，而是每一步的约束。关键目标是：身份可识别、权限可限制、敏感信息可保护、危险行为可阻断、过程可审计。',
        question:'怎样让 Agent 有足够权限把事做完，又不会拥有超过任务所需的权限？', inbound:'用户身份、策略、敏感数据、行动意图', core:'认证、授权、校验、过滤、审批与审计', outbound:'被允许且可追溯的行动', guard:'最小权限、默认拒绝、人工审批、撤销与监控',
        structure:[['身份与授权','确认是谁在请求，并将其转换为最小必要的资源访问权限。'],['执行前防护','对工具参数、数据流、输出和高风险动作设置规则与审批。'],['事后审计','记录谁在何时用什么依据做了什么，以支持复盘、申诉和改进。']], refs:['mcp','agentsdk','aws','azure','google'],
        children:[
          C('identity','身份认证','Authentication','确认用户、服务和 Agent 的身份。常见实现包括企业单点登录、服务账号、短期令牌和多因素认证。',['身份凭证','认证服务验证','签发会话或令牌','调用方身份进入策略'], '可信的调用主体','认证只回答“你是谁”；是否允许访问某资源，要由授权策略决定。','员工通过企业账号登录，Agent 代表该员工检索其有权查看的项目文档。'),
          C('authorization','授权与最小权限','Authorization and Least Privilege','根据身份、任务、资源和上下文判断是否允许某动作，并只授予完成当前任务所需的最小权限。',['身份与任务上下文','策略判断','临时、受限权限','允许、拒绝或要求审批'], '受限的行动能力','“Agent 有 API Key”不等于合理授权；长效、全局权限是常见风险来源。','报表 Agent 可读订单汇总，但不能读取客户身份证号，也不能执行退款。'),
          C('approval','审批机制与人类把关','Approval and Human Oversight','审批机制把高风险、低置信、例外或不可逆的动作送到有责任和权限的人手中。它需要明确触发条件、待审材料、可选决定、超时策略和审计记录。',['识别高风险或例外','冻结动作并生成审批包','人工批准、修改或拒绝','回写决定并继续或终止'], '有责任的自动化边界','审批不是把所有任务都交给人；应把关口放在金额、影响范围、法律合规或置信度真正需要人判断的位置。','采购 Agent 准备好订单草稿和供应商比价，但金额超过额度时必须由预算负责人批准后才能下单。'),
          C('secrets','密钥与凭据管理','Secrets Management','安全保存、轮换和按需注入 API 密钥、令牌、数据库凭据等敏感信息，避免其出现在提示词、日志或代码中。',['密钥库','按身份申请短期凭据','受控注入执行环境','轮换与撤销'], '不暴露的服务凭据','不要让模型在文本中看到或生成真实密钥；工具层应持有凭据，模型只发起受控请求。','浏览器 Agent 调用 CRM 时由连接器获取短期令牌，模型只知道“更新联系人”工具。'),
          C('guardrail','安全护栏','Guardrail','对输入、输出、工具调用和流程状态施加规则，例如内容过滤、敏感信息识别、参数约束、预算和风险分级。',['输入与行动意图','规则或分类器检查','允许、改写、拒绝或升级','记录决策'], '风险受控的交互与行动','护栏不是只审查文本；真正高风险往往发生在工具调用和数据流转。','转账工具拒绝超过阈值的金额，并要求匹配收款人白名单和人工批准。'),
          C('audit','隐私与审计','Privacy and Audit','规定数据最小化、保留期限、访问记录、删除权和审计轨迹。审计关注“发生了什么”，隐私关注“哪些信息可以被收集和使用”。',['数据分类','最小化收集与脱敏','记录访问与行动','保留、导出或删除'], '合规的数据与可回放过程','日志越全不一定越好；日志本身也可能携带敏感提示词、检索片段或工具结果。','只记录任务标识、决策和脱敏摘要；对敏感原文设置独立访问控制与保留期。')
        ]
      },
      evaluation: {
        no:'07', title:'评测、可观测性与持续优化', english:'Evaluation, Observability and Improvement', color:'var(--teal)',
        intro:'Agent 的质量不能只靠“回答看起来不错”判断。需要将任务成功、过程质量、工具正确性、安全、时延、成本和用户反馈一起观察，并把问题定位到模型、提示词、检索、工具还是流程。',
        question:'如何证明 Agent 在真实场景中完成了任务，并在出错时知道问题出在哪里？', inbound:'测试样本、线上请求、执行轨迹、用户反馈', core:'记录、评估、监控、归因与实验', outbound:'质量结论、告警、改进优先级', guard:'代表性样本、指标定义、隐私脱敏、版本可比性',
        structure:[['链路追踪','串联模型调用、检索、工具、状态和耗时，回答“这次是怎么发生的”。'],['离线评测','在固定样本和环境中比较不同版本的任务成功率、引用、工具准确率与安全性。'],['线上运营','观察真实分布、成本、时延、失败类型和人工反馈，发现离线没有覆盖的问题。']], refs:['agentbench','gaia','swebench','webarena','agentsdk','langgraph'],
        children:[
          C('trace','链路追踪','Trace','为一次任务分配统一标识，记录输入摘要、模型调用、检索证据、工具参数、状态转移、输出和耗时，使过程可回放、可定位。',['任务开始','跨组件记录 Span','关联模型与工具结果','形成可检索轨迹'], '端到端可观测过程','追踪不是把所有敏感内容原样存下；需要脱敏、采样、访问控制和保留策略。','用户说“结果不对”时，工程师可查看是检索到了旧制度、重排序失误，还是工具写入失败。'),
          C('offlineeval','离线评测','Offline Evaluation','在固定或版本化的数据集和沙盒环境中，批量运行 Agent，对任务完成、事实依据、工具调用、安全和成本做可比测试。',['代表性样本与标注','固定环境运行','按指标评分','比较版本差异'], '发布前的质量证据','离线高分不等于线上可靠；样本应覆盖常见、边界、对抗和高风险情形。','更新提示词前，在 300 个历史工单上比较解决率、升级率、引用正确率和平均成本。'),
          C('monitoring','线上监控','Online Monitoring','持续观察真实流量中的成功率、错误率、时延、Token、工具失败、人工接管和安全事件，并设置阈值和告警。',['线上指标与日志','聚合与分组','异常检测','告警、降级或回滚'], '生产运行健康度','监控不是只看平均值；按客户、语言、工具版本和任务类型分组才容易发现局部退化。','某搜索 API 变慢时，Agent 延迟突然升高，系统自动启用缓存或降级为只给出待确认结果。'),
          C('release','版本、实验与发布管理','Version, Experiment and Release Management','把模型、提示词、检索索引、工具契约、工作流和评测集当作可追踪版本；用离线对比、灰度、A/B 实验和回滚，将改动与质量结果建立因果联系。',['定义候选版本与假设','离线回归与安全检查','灰度或对照实验','采纳、回滚并沉淀样本'], '可归因的持续改进','只记录“线上效果变好了”不够；若不记录版本、样本和流量分配，就无法知道是哪项改动造成了变化。','比较两种检索切分策略时，同时固定模型和题集；灰度后再按相同任务分布比较引用正确率与成本。'),
          C('feedback','反馈与实验','Feedback and Experiment','将用户评分、人工纠正、失败案例和业务结果沉淀为改进信号，通过 A/B 测试或受控发布验证优化是否真有效。',['收集反馈','归类失败原因','形成候选改动','对照实验与回滚'], '有证据的持续改进','只追求点赞率可能让 Agent 更会迎合，而非更准确；要同时看任务完成、事实性、安全和业务结果。','用户经常修改摘要中的数字，就把该类案例加入评测集，优先检查数据抽取与引用逻辑。')
        ]
      },
      applications: {
        no:'10', title:'应用落地与项目实践', english:'Applications and Project Practice', color:'var(--green)',
        intro:'Agent 不应按“用了哪个模型”来定义，而应按它承担的业务责任、允许的行动和验收方式来定义。研究、编码、数据分析和流程自动化看似不同，但都需要清楚的输入、工具、证据、权限和交接。',
        question:'怎样从一个业务问题开始设计 Agent，而不是从某个流行框架开始？', inbound:'业务目标、角色、数据、权限、风险等级', core:'任务专用流程与能力组合', outbound:'可验收的业务产物或行动', guard:'人机分工、领域规则、验收指标、责任归属',
        structure:[['任务定义','先定义交付物、允许行动、失败后果和验收方式。'],['能力组合','按任务选择模型、检索、工具、技能和流程，而非平均堆叠。'],['人机协同','把高风险、低置信或需要价值判断的步骤交给人。']], refs:['gaia','swebench','webarena','survey'],
        children:[
          C('researchagent','研究型智能体','Research Agent','围绕一个问题搜集、比较、引用和综合信息的 Agent。质量核心不是写得像报告，而是来源覆盖、证据可追溯、结论与证据匹配。',['研究问题','检索与来源筛选','摘取证据与比较','生成带引用结论'], '可复核的研究产物','研究 Agent 不是搜索结果拼贴机；必须区分事实、推断、观点和不确定性。','比较三家云厂商时，按运行时、记忆、安全、评测、定价等维度引用官方资料。'),
          C('codingagent','编程智能体','Coding Agent','在代码仓库和执行环境中理解问题、修改文件、运行测试、检查差异并提交可审阅结果的 Agent。',['Issue 与代码库','定位相关文件','修改与运行测试','差异、证据与交接'], '经测试的代码变更','能生成代码不等于能解决真实问题；仓库上下文、测试、依赖和安全边界决定可靠性。','修复 bug 时，Agent 先复现失败测试，再最小化修改，最后报告测试结果和改动范围。'),
          C('dataagent','数据分析智能体','Data Analysis Agent','以自然语言协助查询、清洗、分析和解释数据。它需要受控的数据访问、可重现代码、指标口径和可视化核验。',['分析问题','数据权限与查询','计算与可视化','解释、引用口径、复核'], '可追溯的分析结论','图表好看不代表口径正确；日期范围、去重、缺失值和单位必须明确。','销售额下降分析需要先确认筛选条件和数据刷新时间，再展示计算过程与图表。'),
          C('processagent','业务流程智能体','Business Process Agent','在工单、客户关系管理、采购、报销等系统中读取状态、执行规则、发起受控操作并升级例外的 Agent。',['业务事件','检索规则与当前状态','执行受限动作','通知、记录或人工审批'], '有边界的流程推进','自动化不等于无审批。不可逆、高金额、合规敏感动作应保留人类签核。','售后 Agent 可自动分类和补全工单，退款或修改合同须转人工。'),
          C('officeagent','办公、客服与销售智能体','Office, Customer Service and Sales Agent','面向日常办公、客户服务和销售跟进的 Agent，常处理邮件、会议纪要、知识问答、工单、客户记录和下一步建议。它的重点是减少重复整理，同时避免替人做承诺、报价或关键决策。',['请求、会话或业务事件','检索资料与读取受限系统','生成草稿、分类或行动建议','人工确认或受控写入'], '可审阅的业务协助','自动回复不等于可以代表公司承诺；价格、合同、退款和客户敏感信息需要规则、权限与人工关口。','销售 Agent 汇总客户会前资料并起草跟进邮件，客户经理确认后再发送并写入 CRM。'),
          C('embodied','具身智能体','Embodied Agent','通过传感器观察物理或模拟环境，并以机器人、设备或游戏中的动作影响环境的 Agent。它更强调感知误差、物理安全和实时控制。',['传感器状态','任务与环境模型','行动规划','执行与反馈'], '在环境中闭环行动','语言模型不能单独保证物理安全；低层控制、碰撞检测和安全停机必须独立可靠。','仓储机器人可用语言理解任务，但移动、抓取和避障应由经过验证的控制系统约束。')
        ]
      },
      improvement: {
        no:'03', title:'记忆与上下文工程', english:'Memory and Context Engineering', color:'var(--plum)',
        intro:'这一层解决“模型在这一轮该看到什么，以及跨轮该记住什么”。记忆保存经过筛选的状态、偏好、事实或经验；上下文工程在有限窗口中选择、排序、压缩和隔离信息。它们都不是聊天记录的无限堆积。',
        question:'怎样让 Agent 既能延续任务和用户偏好，又不把过期、无关或敏感信息带进当前回答？', inbound:'对话、工具结果、任务状态、用户偏好与候选资料', core:'写入判断、分类、检索、压缩与上下文构造', outbound:'当前任务所需的可信状态与信息', guard:'来源、时效、权限、保留期、删除与上下文预算',
        structure:[['短期状态','保存当前任务的进度、工具结果和临时变量，任务结束后归档或过期。'],['长期记忆','保存可复用的偏好、稳定事实或经验，并附来源、时间与更新规则。'],['上下文构造','按权限、相关性和 token 预算选择当前要放入模型输入的内容。']], refs:['memgpt','middle','rag','genagents'],
        children:[
          C('shortterm','短期状态','Short-term State','保存当前会话或任务正在进行的事实，例如已完成步骤、工具结果、待确认参数和检查点。它服务于连续执行，不应被默认当成长久记忆。',['当前任务','记录工具结果与进度','任务内按需读取','完成后归档或过期'], '连续而可恢复的任务过程','短期状态过期后不应被模型当作永久事实；长任务还需要检查点与版本信息。','报销流程记住“已完成票据识别，等待费用政策校验”，恢复后从对应节点继续。'),
          C('longterm','长期记忆','Long-term Memory','保留未来任务仍有价值的信息，例如用户语言偏好、稳定业务事实或验证过的经验。每条信息应有来源、时间、置信度、权限和保留规则。',['候选信息','必要性与权限判断','分类、附来源和保留期','按相关性检索'], '适度的个性化与连续性','长期记忆不是聊天记录备份；一次性内容、敏感数据和未经证实的推断不应轻易写入。','用户多次明确选择“中文、简洁、先给结论”可成为偏好；一次临时出差城市通常不该长期保存。'),
          C('memorytypes','记忆类型与用户画像','Memory Types and User Profile','按用途区分工作记忆、情景记忆、语义记忆和用户画像。工作记忆服务当前任务；情景记忆保留曾发生的过程；语义记忆保存经过验证的稳定事实；用户画像只保存经允许且确有必要的偏好或约束。',['候选信息','判断用途、来源与敏感性','选择记忆类型与保留期','按任务最小化读取'], '有边界的连续性与个性化','用户画像不是“尽量多收集个人信息”；它必须有明确用途、授权、删除入口和跨用户隔离。','用户反复要求中文和简洁输出，可作为受控偏好；“上次报销卡住在什么步骤”应留在任务状态而非写进画像。'),
          C('memorywrite','记忆写入与更新','Memory Write and Update','判断什么信息值得写入、何时更新或覆盖旧信息、冲突如何处理。写入应由来源可靠性、稳定性、用户意图和业务规则共同决定。',['新信息或反馈','校验来源与稳定性','合并、更新或拒绝写入','记录版本与删除入口'], '可管理的长期信息','“越记越聪明”是误区；错误或过期记忆会污染后续任务，必须支持更正、撤销和过期。','用户修改常用称呼时，用新偏好覆盖旧偏好并保留变更时间，而不是叠加互相矛盾的两条。'),
          C('contextbuild','上下文构造','Context Construction','按任务目标、权限、相关性、时效、可信度和 token 预算，把系统规则、当前状态、检索证据和必要记忆组织成模型输入。',['候选信息','过滤与去重','排序、压缩、格式化','模型生成与引用'], '高信息密度的当前输入','上下文越长不一定越好；不可信网页和工具返回应被当作数据，而不能覆盖系统规则。','先放任务与硬约束，再放当前状态和高相关证据；长文档只保留必要片段与原文引用。'),
          C('memorygovernance','记忆治理','Memory Governance','为记忆设置访问控制、保留期、删除、导出、审计和多租户隔离。它让个性化与连续性不以牺牲隐私和合规为代价。',['数据分类','最小化写入与脱敏','受控读取与保留','删除、导出与审计'], '可解释的记忆边界','把全部对话永久保存既增加成本，也制造隐私与权限风险；不同用户和租户的记忆必须隔离。','用户提出删除偏好后，系统删除相应记录并使缓存失效，而非只在界面上隐藏它。')

        MP('02 / Act and observe', '推理不是一次长回答，而是带观察的闭环', 'ReAct 等方法把“基于当前信息提出下一步”与“获得工具或环境反馈”交替起来。关键在于每次行动都有明确目的和可观察结果。', [['当前状态','目标、证据缺口与可用工具'],['提出行动','查询、检索、计算或追问'],['外部观察','得到结构化结果或失败信息'],['更新判断','补证、改计划或结束']], [['工具结果优先','最新数值与权限状态应由可信系统提供。'],['不要空转','没有新观察的重复推理通常不会提高正确性。'],['轨迹可评估','可以检查每一步是否真的缩小了证据缺口。']]),
        MP('03 / Uncertainty', '不确定性要改变下一步动作，而非藏在措辞里', '遇到冲突来源、低质量输入或模型无法判断的情况，应根据风险决定追问、扩大检索、交叉验证、转人工或明确拒答。', [['识别信号','来源冲突、低置信、工具失败'],['风险分级','错误后果与可逆性'],['补救路径','追问、核验、降级或交接'],['记录边界','说明已知、未知和下一步']], [['流畅不是置信','表达得肯定不能代替证据充分。'],['高风险更保守','付款、医疗、法律等领域应收紧阈值和审批。'],['评测看行为','检查不确定时是否正确停下，比看长解释更有价值。']])
      ], ['react','tot','reflexion']),
      planning: M('“项目拆解师”把目标变成可执行的任务图。机制加餐关注依赖、检查点与计划修订，避免把一张事项清单误当成可落地的计划。', ['目标分解','依赖图','检查点'], [
        MP('01 / Decompose', '把交付物倒推成可验证的小任务', '计划从最终交付物和验收标准开始，拆出每一步需要的输入、工具、产物和失败处理，而不是只罗列看起来合理的行动。', [['最终交付','例如带出处的竞品报告'],['子任务','取证、比较、计算、撰写'],['输入输出','每项任务的依赖与产物'],['验收点','是否具备继续下一步的证据']], [['粒度合适','过大无法诊断失败，过小会制造大量协调成本。'],['先定义完成','没有验收条件的“继续研究”无法自然停止。'],['固定与动态','确定性环节宜固化，开放性判断才交给模型。']]),
        MP('02 / Dependencies', '顺序不是装饰：它决定何时能并行，何时必须等待', '任务图表达前置条件和可并行节点。例如资料范围确定后可并行收集多家信息，但比较结论必须等待证据归档完成。', [['节点','可执行任务与负责人'],['边','数据依赖、审批或时间约束'],['并行分支','互不依赖的资料搜集'],['汇合节点','统一检查证据并生成结论']], [['状态可恢复','节点完成或失败都应写入状态，而不只留在对话里。'],['并行有成本','共享资源、重复检索和汇合标准需要预先设计。'],['依赖要真实','不要为了画图而连边，每条边都应对应具体前置条件。']]),
        MP('03 / Replan', '计划遇到新证据时，应局部修订而不是整盘重来', '工具失败、资料缺失或约束变化后，系统应判断影响范围，替换或重试受影响节点，并保留已验证结果。', [['观察异常','缺资料、超预算或工具报错'],['影响分析','哪些后续节点依赖该结果'],['局部修订','重试、换源、降级或升级'],['再次验收','确认新路径仍满足原目标']], [['保留已证实产物','不要因一个失败把完成的取证全部丢掉。'],['设置重试上限','重复失败应改变策略或转人工。'],['计划也要评测','查看成功率、步数、成本和无效循环。']])
      ], ['tot','react','langgraph']),
      routing: M('“任务分诊台”通过可解释的特征选择模型、工具、知识源或人工处理路径。机制加餐说明路由决策怎样在质量、延迟、成本和风险之间取舍。', ['请求特征','策略选择','回退与评测'], [
        MP('01 / Classify', '先提取会影响执行路径的信号', '路由不应只看用户写了什么，还需识别任务类型、语言、上下文大小、所需工具、风险等级、截止时间和调用方权限。', [['请求进入','目标、身份、附件与上下文'],['特征提取','任务类别、复杂度、风险、语言'],['策略匹配','选择模型、检索、工具或人工'],['记录理由','保留命中的规则或分类结果']], [['特征可审计','出错时能知道是识别错还是策略错。'],['避免敏感推断','只收集路由必需的数据，不把不相关个人信息当特征。'],['边界优先','高风险和权限限制应先于成本优化生效。']]),
        MP('02 / Select', '不同路径服务不同的能力与预算', '简单分类可以走低成本模型；需要图像理解时调用多模态模型；涉及最新制度时接检索；不可逆动作则进入审批流。', [['能力清单','模型、工具、知识源和人工队列'],['策略规则','条件、优先级与预算'],['执行路径','选定的组合与参数'],['结果回收','质量、时延与失败信号']], [['不是随机换模型','每条路径要有使用条件和预期指标。'],['能力组合','强模型不一定替代检索、规则和工具。'],['成本可控','设置最大 token、工具次数和时间预算。']]),
        MP('03 / Fallback', '主路径失败时，回退也要有边界', 'API 故障、超时、低置信或预算耗尽时，系统要决定重试、换能力、返回待确认结果或转人工。回退策略同样需要评测，不能临时拼接。', [['失败信号','超时、空结果、低置信或安全拦截'],['回退规则','重试、降级、换源或交接'],['用户反馈','说明已完成与待确认部分'],['效果分析','按路径比较成功率与成本']], [['降级不等于静默变差','要让用户知道证据或能力发生了什么变化。'],['防止循环','每种回退设次数和总预算上限。'],['持续校正','基于真实样本调整阈值，而非只凭直觉改规则。']])
      ], ['agentsdk','anthropic','agentbench']),
      reflection: M('“复盘员”依赖测试、规则或人工反馈来修正行动；它不是模型无限自言自语。机制加餐聚焦外部反馈、错误定位与带上限的修订循环。', ['外部反馈','错误归因','修订上限'], [
        MP('01 / Feedback signal', '先获得能证伪刚才结果的外部信号', '代码测试、工具返回、规则校验、检索缺失和人工评分都能说明某一步是否成立。没有新证据的“再想一遍”很难可靠纠错。', [['执行产物','回答、代码或工具动作'],['外部检查','测试、规则、比较或人工反馈'],['失败信号','差异、异常、拒绝或低评分'],['状态更新','记录失败位置与可用证据']], [['反馈越具体越好','测试断言比“看起来不太对”更易修复。'],['保留原始结果','便于比较修订前后到底改变了什么。'],['区分系统错误','工具故障与模型判断错误应走不同修复路径。']]),
        MP('02 / Diagnose', '定位是哪一个假设、工具或约束出了错', '把失败映射到计划节点、输入数据、工具参数、检索证据或输出格式，才能选择有针对性的补救，而不是重跑整个任务。', [['失败定位','关联轨迹中的具体节点'],['原因分类','事实缺失、参数错、逻辑错或环境错'],['修订选择','补检索、改参数、换计划或升级'],['验证修订','用同类检查确认问题消失']], [['一次只改关键变量','多处同时修改会让效果难以归因。'],['错误可复用','把典型失败沉淀进评测集和规则。'],['避免自证','不要只用模型自己的解释作为唯一归因依据。']]),
        MP('03 / Stop', '反思要会结束：有次数、预算和升级门槛', '连续失败、证据不足或高风险场景下，系统应停止尝试并交接。终止条件让反思保持在可控成本与可审计范围内。', [['循环计数','记录尝试次数与总开销'],['阈值判断','成功、失败、预算或风险阈值'],['结束动作','返回部分结果、交接或终止'],['复盘归档','保留失败模式供后续改进']], [['停止是正确行为','不能解决时明确边界比编造答案更可靠。'],['人可接手','交接包应包括失败尝试和已验证事实。'],['离线验证','用固定失败样本测试是否会无效循环。']])
      ], ['reflexion','agentsdk','langgraph']),
      loop: M('“任务计时员”管理一次 Agent 执行从观察到行动再到停止的节奏。机制加餐强调状态、预算和终止条件，防止循环只是在消耗 Token。', ['观察','行动','停止条件'], [
        MP('01 / Observe', '每一轮先读取真实的当前状态', '状态包括目标、已完成步骤、工具结果、待确认参数、错误和剩余预算。它是下一步决策的依据，不能只依赖模型记忆上一次回答。', [['任务状态','目标、进度和约束'],['外部信息','检索证据和工具结果'],['状态压缩','保留继续执行所需事实'],['下一步输入','交给决策节点']], [['状态有版本','避免重试时使用已经过期的工具结果。'],['敏感最小化','不把无关私人数据无限带入每轮上下文。'],['可恢复','中断后能从明确状态重新开始。']]),
        MP('02 / Act', '一次行动必须有目标、参数和可观察结果', '模型可以提出查询、计算、写入或追问，但应用负责检查参数和权限，执行后把结构化结果写回状态。', [['决策','选择一个最能推进目标的行动'],['参数','明确对象、范围和约束'],['受控执行','校验、授权、超时与幂等'],['观察结果','成功、失败或需要补充信息']], [['单步可验证','避免一次提出无法检查的长串操作。'],['工具结果可信','外部系统返回比模型猜测更适合作为状态事实。'],['副作用分级','写入和不可逆动作需要更高门槛。']]),
        MP('03 / Stop', '完成、交接和安全停止都是循环的合法出口', '终止应由交付物验收、无法继续、预算耗尽、风险升级或用户取消触发。停止后要给出明确的完成情况和下一步。', [['检查条件','验收、风险、预算与取消信号'],['选择出口','完成、部分完成、交接或终止'],['生成交付','结果、证据与未完成项'],['保存轨迹','供恢复、审计和评测使用']], [['不要只看最大轮数','轮数上限必要，但应配合目标完成条件。'],['部分结果有价值','无法订票时可返回已验证候选和限制条件。'],['行为可测试','评测应覆盖成功、失败、超时和取消路径。']])
      ], ['react','langgraph','agentsdk']),
      knowledgebase: M('“档案管理员”处理的是资料从原始文件到可检索证据的完整生命周期。机制关键在于解析、元数据、权限与版本，而不是单纯把 PDF 放进一个目录。', ['解析入库','元数据与权限','更新质量'], [
        MP('01 / Ingest', '原始资料先要变成结构化、可定位的内容', '扫描件、网页、表格和数据库记录需要分别解析。正文、标题、表格、附件关系和来源位置应被保留，才能支持后续分段和引用。', [['来源接入','文件、网页、表或业务系统'],['解析转换','提取正文、结构与附件'],['质量检查','乱码、缺页、重复和解析失败'],['可检索单元','进入分段和索引流程']], [['来源标识必留','每条内容要能回到原文件或记录。'],['格式差异大','扫描 PDF 常需要 OCR；表格需保留行列含义。'],['解析失败可见','不能把空文本当作已入库。']]),
        MP('02 / Metadata', '文档“是什么、对谁有效、何时生效”要变成字段', '标题相近的制度可能适用于不同组织或时间。版本、生效期、部门、密级、所有者和来源链接应在检索前就可以过滤。', [['内容片段','正文与结构化字段'],['业务元数据','版本、范围、生效期与标签'],['权限策略','角色、租户和资源级授权'],['检索过滤','先排除不适用和无权内容']], [['元数据不是装饰','它决定相似资料能否被正确排除。'],['权限前置','不要先把无权资料送进模型再试图隐藏。'],['字段需治理','枚举、日期和组织名称要有统一口径。']]),
        MP('03 / Lifecycle', '制度更新后，旧证据不能悄悄继续回答', '资料应有发布、修订、废止、归档与删除流程。更新后同步处理分段、向量、缓存和引用，使系统能区分当前有效与历史记录。', [['版本事件','新建、修订、废止或删除'],['受影响内容','定位文档、片段、向量和缓存'],['索引更新','重算、失效或保留历史版本'],['上线核验','用代表性问题检查新旧切换']], [['历史可查不等于默认可答','需要明确历史查询入口和提示。'],['更新可追溯','保留谁在何时变更了哪份资料。'],['质量持续测','零结果、错误引用和用户纠正都应反馈到入库流程。']])
      ], ['rag','selfrag','middle']),
      rag: M('“带引文的答题员”把回答建立在当前检索到的证据上。机制加餐依次拆开证据选择、上下文注入和回答核验，说明 RAG 不是把几段文本拼进提示词就结束。', ['检索证据','上下文构造','引用核验'], [
        MP('01 / Retrieve', '先从全库缩小到少量可用证据', '问题进入后，系统按权限、时间和业务范围过滤，再用关键词、向量或混合检索召回候选，并通过重排序选出最能支撑回答的片段。', [['问题与身份','目标、组织和时间条件'],['召回候选','关键词、向量或混合检索'],['选择证据','过滤、重排序、去重'],['证据包','片段、来源、版本和定位信息']], [['召回与答案分离','找到了资料不代表模型一定会正确使用。'],['控制数量','证据过多会挤占上下文并增加冲突。'],['优先一手来源','制度原文、数据库记录通常优于转述。']]),
        MP('02 / Augment', '把证据放到模型输入中，也要安排顺序和格式', '上下文应先给任务和硬约束，再给带来源的证据片段。长文档需要选择、压缩或分层，而非把整库硬塞进窗口。', [['系统规则','回答范围、引用与拒答要求'],['当前任务','问题和所需输出格式'],['证据片段','有编号、来源和生效信息'],['模型生成','依据证据组织回答']], [['证据要可辨','让模型知道哪些是引用内容，哪些是任务规则。'],['位置会影响使用','长上下文中间的信息可能被忽略，需要评测排序。'],['不要藏冲突','不同版本相矛盾时应说明并请求澄清或按规则选择。']]),
        MP('03 / Verify', '最后检查回答是否真的由引用支撑', '生成后可检查引用是否存在、是否指向正确片段、数值是否与证据一致，以及是否遗漏适用条件。高风险问题还需要规则或人工复核。', [['草稿回答','结论、条件与引用标记'],['引用对齐','每项关键主张回到证据'],['规则核验','数值、版本、权限和业务条件'],['交付或升级','给出答案、追问或转人工']], [['不能只看文风','带了链接也可能引用错段或错误概括。'],['回答可拒答','证据不足时应明确说无法从现有资料确认。'],['端到端评测','同时测检索覆盖、引用正确率和最终任务成功率。']])
      ], ['rag','selfrag','middle']),

        ['Versioning','技能改了方法，也要重新考试','每个技能版本应绑定依赖、模板、脚本和评测用例。更新后用代表性任务验证质量、成本和安全，再逐步发布。',[['版本变更','说明、脚本、资源或工具契约'],['离线评测','正确、完整、格式与安全'],['受控发布','小范围试用并监控失败'],['回滚归档','保留稳定版本和迁移说明']],[['依赖要锁定','外部 API 或模板变化可能破坏旧技能。'],['结果可复现','记录使用的技能版本与输入来源。'],['不是模型训练','技能可快速更新流程，而无需改变基础模型参数。']]]
      ], ['agentsdk','anthropic','mcp']),
      toolcalling: K('“受控遥控器”把模型的调用意图变成应用可验证的函数请求。机制加餐拆开工具模式、执行边界和失败恢复。', ['工具契约','受控执行','失败恢复'], [
        ['Schema','先把工具能做什么写成明确契约','工具定义包括名称、用途、参数类型、必填项、枚举、返回结构和副作用。模型据此提出调用，应用仍需独立校验。',[['工具描述','用途与适用条件'],['参数模式','字段、类型、范围和枚举'],['模型提议','函数名与结构化参数'],['模式校验','接受、要求修正或拒绝']],[['描述影响选择','含糊工具名会导致误调用。'],['参数模式不验证权限','格式正确仍可能越权或违反业务规则。'],['读写要区分','查询和修改最好使用不同工具与审批等级。']]],
        ['Execution','真正的执行发生在模型之外','应用结合调用者身份、业务规则和当前状态检查请求，注入受控凭据后调用真实系统，再返回结构化结果。',[['调用请求','工具名、参数和任务上下文'],['执行前检查','身份、权限、风险、幂等与预算'],['外部调用','超时、重试和凭据隔离'],['结果回传','成功数据、错误码和证据']],[['模型看不到密钥','凭据保留在连接器或执行层。'],['不可逆动作确认','付款、删除、发送等在执行前设置人工或规则关口。'],['返回不要含糊','用明确错误码和可重试信息帮助下一步判断。']]],
        ['Recovery','失败后不能只把报错再喂给模型','超时、限流、参数错误和业务拒绝需要不同处理。系统按错误类别决定重试、修正、换路径或停止，并防止重复副作用。',[['错误分类','网络、认证、参数、业务或未知'],['恢复策略','指数退避、修参、刷新凭据或升级'],['幂等控制','同一动作使用稳定请求标识'],['状态记录','保留尝试次数和最终结果']],[['重试有上限','权限拒绝不应通过反复调用解决。'],['副作用先查状态','超时不代表未执行，重试前查询真实结果。'],['工具也要评测','检查选择正确率、参数正确率和业务成功率。']]]

      mcp: K('“统一插座”解决模型应用怎样发现并调用工具、读取资源和使用提示模板。机制加餐解释客户端、服务器与传输边界，以及协议为何不等于授权。', ['能力发现','请求交换','信任边界'], [
        ['Discovery','客户端先向服务器询问有哪些能力','MCP 服务器以标准结构公开工具、资源和提示模板；客户端决定展示哪些能力给模型，并保留自己的产品和权限策略。',[['客户端连接','建立会话并协商协议能力'],['服务器列举','Tools、Resources 与 Prompts'],['客户端筛选','按配置、用户与任务暴露能力'],['模型使用','在可见能力中选择调用或读取']],[['发现不等于允许','服务端和客户端仍需认证、授权与审计。'],['描述要准确','工具说明和参数模式直接影响模型选择。'],['能力可变化','客户端需处理列表更新与服务器不可用。']]],
        ['Exchange','标准消息让不同客户端和服务端按同一方式交互','客户端发送结构化请求，服务器执行并返回内容或错误。协议统一交互形状，但具体数据库、文件和业务逻辑仍属于服务器实现。',[['模型提出意图','选择工具或资源'],['客户端请求','附参数和会话上下文'],['服务器处理','校验、访问后端并生成结果'],['标准响应','内容、结构化数据或错误']],[['传输可替换','本地进程与远程服务可采用不同传输方式。'],['错误要可处理','返回明确的协议和业务错误，而非混成自然语言。'],['内容仍不可信','读取到的网页或文档不能反过来获得系统权限。']]],
        ['Trust','协议统一接法，不替代安全治理','部署者要决定信任哪些服务器、允许它访问哪些数据、是否能产生副作用，以及用户何时确认。连接远程 MCP 服务也意味着数据可能离开当前环境。',[['服务器来源','官方、自建或第三方'],['权限范围','文件、网络、账号和工具副作用'],['执行确认','高风险调用前展示对象与影响'],['审计撤销','记录访问并支持断开和轮换凭据']],[['最小权限','不要给通用服务器整个文件系统或长期令牌。'],['数据去向透明','发送提示、文件或结果前知道目的服务。'],['供应链风险','服务器代码和依赖更新需要评审与锁定。']]]
      ], ['mcp','openaiSafety','owasp']),
      connector: K('“系统翻译器”把具体产品的认证、对象和错误包装成稳定能力。机制加餐说明连接器如何适配外部 API、处理速率与一致性，并向上层暴露可用的工具。', ['系统适配','可靠调用','契约演进'], [
        ['Adapt','先把外部系统语言翻译成领域能力','连接器处理登录方式、分页、字段名、对象关系和供应商错误码，再以业务可理解的工具或资源提供给 Agent。',[['外部 API','认证、端点和供应商对象'],['适配映射','字段、枚举、分页和错误转换'],['领域能力','查客户、建工单等清晰动作'],['上层使用','技能、工作流或 MCP 服务暴露']],[['不要泄漏供应商细节','上层不必了解每个原始字段和错误文本。'],['保留原始标识','结果要能回到源系统记录。'],['只做适配','何时更新客户属于业务流程，不属于连接器决定。']]],
        ['Reliability','外部系统有速率、超时和部分成功','连接器统一处理限流、重试、分页、游标、幂等和熔断，并把可重试与不可重试错误区分开。',[['请求进入','身份、动作和参数'],['策略检查','限速、超时、幂等和配额'],['供应商调用','分页或批量执行'],['标准结果','数据、状态、来源与分类错误']],[['重试前看副作用','写入超时可能已经成功。'],['批量部分成功','逐项返回结果，不能只给整体失败。'],['凭据隔离','连接器持有受控令牌，模型不接触秘密。']]],

    Object.assign(mechanicsProfiles, {

        ['Graph','每个节点做一件可执行、可检查的事','工作流把触发、任务、条件分支和结束状态显式连接。节点输入输出有模式，边由程序条件或经过约束的判断驱动。',[['触发事件','上传、定时或业务状态变化'],['处理节点','解析、查询、校验或生成'],['条件分支','通过、拒绝、补充或人工审核'],['结束状态','完成、失败、取消或待处理']],[['规则明确就写代码','金额阈值和权限判断不必交给模型猜。'],['状态要持久化','长流程不能只存在一次进程内。'],['每条边可解释','知道为什么从当前节点走到下一节点。']]],

        ['Compensation','失败不仅要重试，还要知道怎样撤回已完成动作','跨系统流程很难使用单一数据库事务。对已发送、已写入或已预订动作设计补偿、对账和人工处置。',[['动作执行','带幂等标识写入外部系统'],['失败检测','超时、拒绝或下游异常'],['状态确认','查询动作是否实际发生'],['补偿路径','撤销、反向操作或人工处理']],[['补偿不是回滚时间','某些动作如邮件发送无法真正撤回。'],['重试需幂等','防止恢复流程重复扣款或建单。'],['异常可见','进入人工队列时带全量状态和证据。']]]

      stategraph: K('“地图和书签”用显式状态、节点和边表达任务现在在哪、还能去哪。机制加餐覆盖状态模式、转移条件和持久化恢复。', ['状态模式','转移条件','检查点恢复'], [
        ['State schema','先定义哪些信息属于任务状态','状态应包含任务输入、节点产物、错误、重试次数和人工等待等字段，并区分可覆盖值与追加事件。',[['初始状态','目标、身份和约束'],['节点读取','只消费所需字段'],['节点写入','结果、错误与下一步信号'],['状态归并','处理并行分支和版本冲突']],[['状态不是提示词','它是应用数据，之后才按需构造模型上下文。'],['字段有所有者','避免多个节点随意覆盖同一结果。'],['大对象外置','文件和长证据存引用，不必塞入每个检查点。']]],

        ['Topology','先选最小可用的协作结构','主管-专家适合集中分派；顺序交接适合流水处理；并行评审适合独立比较。结构应由任务依赖决定，不因“多 Agent”本身增加角色。',[['总任务','拆出专业或可并行子任务'],['角色定义','职责、工具、权限与成功标准'],['协作拓扑','主管、顺序、并行或有限辩论'],['停止规则','完成、冲突升级或预算用尽']],[['单 Agent 优先','若任务没有真实分工，多角色只增加成本。'],['权限按角色分配','研究角色不应拥有付款工具。'],['并行不是免费','重复检索和汇总会增加时延与 token。']]],

        ['Trigger','什么时候必须交接，应由风险和能力边界决定','权限不足、金额超阈值、证据冲突、用户明确要求或连续失败都可以触发交接。条件应可测试，而非只让模型自行感觉。',[['当前状态','任务进度、风险和失败次数'],['条件判断','权限、阈值、置信和用户选择'],['选择接收方','专责 Agent、业务队列或具体角色'],['暂停当前执行','冻结副作用并保存检查点']],[['高风险前交接','应发生在付款或发布之前，而非出错之后。'],['接收方要匹配','不同问题进入不同专业和权限队列。'],['紧急程度明确','截止时间和服务等级随交接传递。']]],

        ['Store','密钥集中保存在专用系统，不进代码和提示词','密钥库加密保存 API Key、证书和数据库凭据，并用身份和策略控制谁可以读取或使用。',[['秘密创建','生成高熵值并标记所有者'],['密钥库存储','加密、访问控制与审计'],['应用引用','只保存逻辑名称或路径'],['受控读取','运行时按工作负载身份申请']],[['代码仓库不存密钥','即使私有仓库也可能复制和泄露。'],['提示词不传密钥','模型上下文、日志和追踪都不是秘密存储。'],['分环境隔离','开发、测试和生产使用不同凭据。']]],

        ['Communicate','中间产物要比长段对话更可复用','建议统一传递结论、证据链接、置信度、假设、未解决项和可机器校验的字段。主管据此判断是合并、补问、交给验证者还是停止。',[['任务消息','目标、输入和限制'],['子任务产物','结构化结论与证据'],['冲突检测','比较来源、假设和数值'],['主管决策','采纳、退回、交接或升级']],[['通信可版本化','字段变更和大型产物应有稳定引用。'],['不要共享全部思维','需要的是可检查结果，而非不可验证的内部推演。'],['状态要有权威源','共享白板与数据库更新要处理并发和冲突。']]],

        ['Trigger','审批条件应由可审计策略决定','金额、影响范围、不可逆性、法律合规、低置信、策略冲突或用户要求都可以触发审批。触发后先冻结副作用，而不是先执行再补签。',[['动作候选','对象、参数和预期影响'],['策略评估','风险、权限和阈值'],['命中关口','暂停自动执行'],['创建审批','关联任务与有效期']],[['规则应可解释','审批人需要知道为什么此事被送来。'],['低置信不等于高风险','两者可组合，但需分别定义门槛。'],['避免审批泛滥','低风险、可逆任务过度审批会使系统失去效率。']]],

    const foundationPrimer = () => topicKey === 'foundation' ? `

        const foundationGuide = `

        } else {
          container.innerHTML = `${foundationGuide}
            <section class="llm-deep-dive" id="${mechanicsId}" aria-labelledby="llm-mechanics-title"><span id="llm-mechanics" aria-hidden="true"></span>
              <div class="llm-lede"><div><p class="llm-kicker">03 / 机制加餐 · 与其他四类模型同级</p><h3 id="llm-mechanics-title">机制加餐：大语言模型怎样生成与决策</h3><p>“文稿起草员”是任务现场的比喻；下面拆开它的真实工作：文字如何被切成 token，token 如何关联并产生候选，以及为什么它必须与检索、工具和验证协作。</p><div class="mechanics-map" aria-label="机制加餐内容索引"><span>token</span><span>生成</span><span>注意力</span><span>Agent 分工</span><span>采样</span><span>边界</span></div></div><a class="llm-backlink" href="#child-visual">返回大话大语言模型</a></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">01 / Token</p><h3>它读的不是完整句子，而是 token</h3></div><p class="llm-note">token 是模型处理文本的基本片段，可能是一个字、一个词的一部分、标点或空格。不同模型的切分方式不同，所以“一个字等于一个 token”并不准确。</p></div><div class="llm-token-board"><div class="llm-token-main"><h4>“请总结这份合同”会被拆成可计算片段</h4><p>实际切分由具体分词器决定；下面只是概念示意。</p><div class="llm-tokens"><div class="llm-token">请<small>token 1</small></div><span class="llm-arrow">+</span><div class="llm-token">总结<small>token 2</small></div><span class="llm-arrow">+</span><div class="llm-token">这份<small>token 3</small></div><span class="llm-arrow">+</span><div class="llm-token">合同<small>token 4</small></div></div></div><aside class="llm-token-side"><h4>三个直接影响</h4><div class="llm-fact"><b>上下文长度</b><span>模型以 token 计量输入与输出容量，而不是以汉字或页数计量。</span></div><div class="llm-fact"><b>成本与时延</b><span>读得更多、写得更多，通常意味着更多计算和更高成本。</span></div><div class="llm-fact"><b>结构化输出</b><span>JSON、代码、工具参数也都是 token 序列，需要通过模式和校验保证可靠。</span></div></aside></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">02 / Generation</p><h3>一轮生成：从文字到下一个 token</h3></div><p class="llm-note">模型内部有很多重复层与矩阵计算；对使用者而言，理解“表示 -> 关联 -> 概率 -> 选择”已足以建立正确直觉。</p></div><div class="llm-pipeline"><div class="llm-pipeline-inner"><article class="llm-pipe"><span class="number">A</span><strong>分词</strong><p>把文字转成 token 编号。</p></article><article class="llm-pipe"><span class="number">B</span><strong>词向量与位置</strong><p>把编号映射为数字向量，并标注顺序。</p></article><article class="llm-pipe"><span class="number">C</span><strong>Transformer 层</strong><p>反复计算 token 之间的上下文关系。</p></article><article class="llm-pipe"><span class="number">D</span><strong>候选概率</strong><p>为可能的下一个 token 产生概率分布。</p></article><article class="llm-pipe"><span class="number">E</span><strong>采样或选择</strong><p>选出下一个 token，重复直到停止。</p></article></div></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">03 / Attention</p><h3>注意力机制：决定当前片段该参考谁</h3></div><p class="llm-note">注意力机制（attention）允许模型在处理某个位置时，对其他位置赋予不同权重。它不是人类的“专注力”，也不等于模型真正理解了语言，但它有效建立了上下文关联。</p></div><div class="llm-attention"><div class="llm-attention-visual"><h4>例：理解“合同在明天到期”中的“到期”</h4><p>当前 token 可以更关注“合同”“明天”等与语义和时间有关的片段。</p><div class="llm-sentence"><span class="llm-attention-line llm-line-one"></span><span class="llm-attention-line llm-line-two"></span><span class="llm-attention-line llm-line-three"></span><span class="llm-word">合同</span><span class="llm-word">在</span><span class="llm-word">明天</span><span class="llm-word active">到期</span></div></div><aside class="llm-attention-copy"><h4>它解决什么</h4><ul class="llm-list"><li>在长句或文档片段中建立关联，而不是只看紧邻的字。</li><li>让模型根据位置和语义，在生成下一步时选择不同信息作为参考。</li><li>配合多层网络，逐步形成更复杂的模式表示。</li></ul><p style="margin-top:16px"><b>需要保留的谨慎：</b>注意力权重不是可靠的“解释报告”，不能单独证明模型为何得出某个结论。</p></aside></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">04 / Agent brain</p><h3>LLM 在 Agent 里：负责判断，不独自包办</h3></div><p class="llm-note">可靠系统会在模型之外提供知识、工具、状态、执行约束和结果验证，让模型的语言能力进入一个可控循环。</p></div><div class="llm-agent-loop"><svg viewBox="0 0 930 360" role="img" aria-label="大语言模型在智能体中与上下文、工具和验证协同的关系图"><path class="llm-wire main" d="M195 125H330M550 125H690"/><path class="llm-wire" d="M440 193V250M770 175V250H550"/><path class="llm-wire" d="M690 295H550"/><g class="llm-node" style="--accent:var(--teal)"><rect x="35" y="75" width="160" height="100"/><text x="115" y="114">上下文</text><text class="minor" x="115" y="138">任务、RAG、记忆</text></g><g class="llm-node" style="--accent:var(--plum)"><rect x="330" y="60" width="220" height="130"/><text x="440" y="108">大语言模型</text><text class="minor" x="440" y="134">判断下一步、生成文本</text><text class="minor" x="440" y="153">或提出结构化工具调用</text></g><g class="llm-node" style="--accent:var(--orange)"><rect x="690" y="75" width="170" height="100"/><text x="775" y="114">工具执行层</text><text class="minor" x="775" y="138">校验、权限、执行</text></g><g class="llm-node" style="--accent:var(--green)"><rect x="330" y="250" width="220" height="75"/><text x="440" y="281">结果验证与状态更新</text><text class="minor" x="440" y="303">测试、规则、追踪、反馈</text></g></svg><div class="llm-caption">重要分工：LLM 可以提出“调用什么工具、用什么参数”；工具执行层仍应负责参数校验、身份授权、真实执行和返回可信结果。</div></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">05 / Sampling</p><h3>为什么同一句问题有时回答不同</h3></div><p class="llm-note">模型会给候选下一个 token 一个概率分布。采样策略决定是更偏向高概率、稳定的候选，还是允许更多低概率候选参与。</p></div><div class="llm-control"><div class="llm-control-main"><h4>采样温度（temperature）的概念演示</h4><p>拖动滑块只展示倾向，不代表某个具体模型的精确行为。需要稳定格式或工具参数时，通常选择更保守的设置；创意任务可适度提高多样性。</p><input class="llm-range" id="llmTemperature" type="range" min="0" max="100" value="25" aria-label="采样温度演示"><div class="llm-range-read"><span>更确定</span><strong id="llmTempValue">0.25 · 稳定优先</strong><span>更多样</span></div><div class="llm-choices" id="llmChoices"><div class="llm-choice active">“合同将于明天到期。”</div><div class="llm-choice">“该合同的截止日期是明天。”</div><div class="llm-choice">“明天就是这份合同的到期日。”</div><div class="llm-choice">“需要尽快确认合同续签安排。”</div></div></div><aside class="llm-control-side"><h4>工程上的处理</h4><p><b>事实、工具和结构化输出：</b>优先稳定、可校验的输出，并设置 JSON 模式或参数验证。</p><p><b>创意、头脑风暴和文案：</b>可允许更多表达变化，但仍需检查事实来源和品牌规范。</p><p><b>注意：</b>温度只是众多采样和解码参数之一，不能把质量问题都归因给它。</p></aside></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">06 / Limits</p><h3>把 LLM 放在合适的位置</h3></div><p class="llm-note">最常见的失误，是把语言上的流畅误认为事实上的可靠。明确分工能让 Agent 同时拥有表达能力、证据和边界。</p></div><div class="llm-boundaries"><div class="llm-do"><h4>适合交给 LLM</h4><ul><li>理解自然语言目标、归纳和改写信息。</li><li>在有限选项间提出计划或工具调用建议。</li><li>从证据中生成带引用的说明草案。</li><li>将不同格式的信息组织成用户易读的结果。</li></ul></div><div class="llm-dont"><h4>不应只靠 LLM</h4><ul><li>最新事实、精确数值、权限判断：接入可信数据和规则。</li><li>不可逆操作：加入参数校验、审批和幂等性控制。</li><li>高风险决策：保留人工复核和可解释的证据链。</li><li>长期记忆：使用可管理、可更新、可删除的外部存储。</li></ul></div></div></div>
              <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">Evidence</p><h3>继续阅读</h3></div><p class="llm-note">这些来源分别支持 Transformer 架构、RAG、上下文局限、工具调用和 Agent 框架的关键判断。</p></div><ul class="refs"><li><a href="${refs.transformer[1]}" target="_blank" rel="noreferrer">Attention Is All You Need</a></li><li><a href="${refs.rag[1]}" target="_blank" rel="noreferrer">Retrieval-Augmented Generation</a></li><li><a href="${refs.middle[1]}" target="_blank" rel="noreferrer">Lost in the Middle</a></li><li><a href="${refs.toolformer[1]}" target="_blank" rel="noreferrer">Toolformer</a></li><li><a href="${refs.agentsdk[1]}" target="_blank" rel="noreferrer">OpenAI Agents SDK</a></li></ul><a class="other-link" href="#childDetail">返回大语言模型概览 -></a></div>
            </section>`;

      const genericGuide = `
        <section class="deep-dive" id="child-visual" aria-labelledby="child-visual-title">${llmAlias}
          <div class="deep-lede"><div><p class="deep-kicker">Beginner visual guide / ${childNo}</p><h3 id="child-visual-title">大话${escapeHtml(child.title)}：先把它放回系统里</h3><p>${escapeHtml(child.definition)}</p></div><a class="deep-backlink" href="#childDetail">返回${escapeHtml(child.title)}概览</a></div>
          <div class="deep-part"><div class="deep-part-head"><div><p class="deep-kicker">01 / Process</p><h3>把它的动作拆成一条可观察的链</h3></div><p class="deep-note">这张图只保留学习时最重要的因果顺序。真实实现可能分支、重试或被规则中断，但仍应能说明每一步接收什么、产出什么。</p></div><div class="deep-process">${process}</div><div class="deep-connection"><div><b>从哪里开始</b><span>${escapeHtml(child.steps[0])}</span></div><div><b>它负责什么</b><span>${escapeHtml(child.output)}</span></div><div><b>不能替代什么</b><span>${escapeHtml(child.confusion)}</span></div></div></div>
          <div class="deep-part"><div class="deep-part-head"><div><p class="deep-kicker">02 / Handoff</p><h3>下一棒交给谁</h3></div></div><div class="deep-situation"><div class="deep-situation-main"><h4>在「${escapeHtml(topic.title)}」中</h4><p><b>${escapeHtml(child.title)}</b> 做完后，留下“${escapeHtml(child.output)}”。</p></div><aside class="deep-situation-side"><h4>先记这一问</h4><p>它输出的东西，下一步由谁使用、如何验证？</p></aside></div></div>
          <div class="deep-part"><div class="deep-part-head"><div><p class="deep-kicker">03 / Scenario</p><h3>换个场景看它</h3></div></div><div class="deep-situation"><div class="deep-situation-main"><h4>情景</h4><p>${escapeHtml(child.example)}</p></div><aside class="deep-situation-side"><h4>容易踩的坑</h4><p>${escapeHtml(child.confusion)}</p></aside></div><a class="other-link" href="#childDetail">返回${escapeHtml(child.title)}概览 -></a></div>
        </section>`;
      if (child.id !== 'llm') { container.innerHTML = genericGuide; return; }
      container.innerHTML = `${genericGuide}
        <section class="llm-deep-dive" id="llm-mechanics" aria-labelledby="llm-mechanics-title">
          <div class="llm-lede"><div><p class="llm-kicker">LLM mechanics / extra guide</p><h3 id="llm-mechanics-title">机制加餐：继续看大语言模型怎样生成</h3><p>大语言模型（Large Language Model，LLM）可以先理解为一台强大的“上下文续写机”：它把输入切成 token，计算这些 token 之间的关系，再一步步预测后续内容。它能写、能归纳、能规划，但不会天然拥有最新事实、真实权限或绝对正确性。</p></div><a class="llm-backlink" href="#child-visual">返回大话大语言模型</a></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">01 / Token</p><h3>它读的不是完整句子，而是 token</h3></div><p class="llm-note">token 是模型处理文本的基本片段，可能是一个字、一个词的一部分、标点或空格。不同模型的切分方式不同，所以“一个字等于一个 token”并不准确。</p></div><div class="llm-token-board"><div class="llm-token-main"><h4>“请总结这份合同”会被拆成可计算片段</h4><p>实际切分由具体分词器决定；下面只是概念示意。</p><div class="llm-tokens"><div class="llm-token">请<small>token 1</small></div><span class="llm-arrow">+</span><div class="llm-token">总结<small>token 2</small></div><span class="llm-arrow">+</span><div class="llm-token">这份<small>token 3</small></div><span class="llm-arrow">+</span><div class="llm-token">合同<small>token 4</small></div></div></div><aside class="llm-token-side"><h4>三个直接影响</h4><div class="llm-fact"><b>上下文长度</b><span>模型以 token 计量输入与输出容量，而不是以汉字或页数计量。</span></div><div class="llm-fact"><b>成本与时延</b><span>读得更多、写得更多，通常意味着更多计算和更高成本。</span></div><div class="llm-fact"><b>结构化输出</b><span>JSON、代码、工具参数也都是 token 序列，需要通过模式和校验保证可靠。</span></div></aside></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">02 / Generation</p><h3>一轮生成：从文字到下一个 token</h3></div><p class="llm-note">模型内部有很多重复层与矩阵计算；对使用者而言，理解“表示 -> 关联 -> 概率 -> 选择”已足以建立正确直觉。</p></div><div class="llm-pipeline"><div class="llm-pipeline-inner"><article class="llm-pipe"><span class="number">A</span><strong>分词</strong><p>把文字转成 token 编号。</p></article><article class="llm-pipe"><span class="number">B</span><strong>词向量与位置</strong><p>把编号映射为数字向量，并标注顺序。</p></article><article class="llm-pipe"><span class="number">C</span><strong>Transformer 层</strong><p>反复计算 token 之间的上下文关系。</p></article><article class="llm-pipe"><span class="number">D</span><strong>候选概率</strong><p>为可能的下一个 token 产生概率分布。</p></article><article class="llm-pipe"><span class="number">E</span><strong>采样或选择</strong><p>选出下一个 token，重复直到停止。</p></article></div></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">03 / Attention</p><h3>注意力机制：决定当前片段该参考谁</h3></div><p class="llm-note">注意力机制（attention）允许模型在处理某个位置时，对其他位置赋予不同权重。它不是人类的“专注力”，也不等于模型真正理解了语言，但它有效建立了上下文关联。</p></div><div class="llm-attention"><div class="llm-attention-visual"><h4>例：理解“合同在明天到期”中的“到期”</h4><p>当前 token 可以更关注“合同”“明天”等与语义和时间有关的片段。</p><div class="llm-sentence"><span class="llm-attention-line llm-line-one"></span><span class="llm-attention-line llm-line-two"></span><span class="llm-attention-line llm-line-three"></span><span class="llm-word">合同</span><span class="llm-word">在</span><span class="llm-word">明天</span><span class="llm-word active">到期</span></div></div><aside class="llm-attention-copy"><h4>它解决什么</h4><ul class="llm-list"><li>在长句或文档片段中建立关联，而不是只看紧邻的字。</li><li>让模型根据位置和语义，在生成下一步时选择不同信息作为参考。</li><li>配合多层网络，逐步形成更复杂的模式表示。</li></ul><p style="margin-top:16px"><b>需要保留的谨慎：</b>注意力权重不是可靠的“解释报告”，不能单独证明模型为何得出某个结论。</p></aside></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">04 / Agent brain</p><h3>LLM 在 Agent 里：负责判断，不独自包办</h3></div><p class="llm-note">可靠系统会在模型之外提供知识、工具、状态、执行约束和结果验证，让模型的语言能力进入一个可控循环。</p></div><div class="llm-agent-loop"><svg viewBox="0 0 930 360" role="img" aria-label="大语言模型在智能体中与上下文、工具和验证协同的关系图"><path class="llm-wire main" d="M195 125H330M550 125H690"/><path class="llm-wire" d="M440 193V250M770 175V250H550"/><path class="llm-wire" d="M690 295H550"/><g class="llm-node" style="--accent:var(--teal)"><rect x="35" y="75" width="160" height="100"/><text x="115" y="114">上下文</text><text class="minor" x="115" y="138">任务、RAG、记忆</text></g><g class="llm-node" style="--accent:var(--plum)"><rect x="330" y="60" width="220" height="130"/><text x="440" y="108">大语言模型</text><text class="minor" x="440" y="134">判断下一步、生成文本</text><text class="minor" x="440" y="153">或提出结构化工具调用</text></g><g class="llm-node" style="--accent:var(--orange)"><rect x="690" y="75" width="170" height="100"/><text x="775" y="114">工具执行层</text><text class="minor" x="775" y="138">校验、权限、执行</text></g><g class="llm-node" style="--accent:var(--green)"><rect x="330" y="250" width="220" height="75"/><text x="440" y="281">结果验证与状态更新</text><text class="minor" x="440" y="303">测试、规则、追踪、反馈</text></g></svg><div class="llm-caption">重要分工：LLM 可以提出“调用什么工具、用什么参数”；工具执行层仍应负责参数校验、身份授权、真实执行和返回可信结果。</div></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">05 / Sampling</p><h3>为什么同一句问题有时回答不同</h3></div><p class="llm-note">模型会给候选下一个 token 一个概率分布。采样策略决定是更偏向高概率、稳定的候选，还是允许更多低概率候选参与。</p></div><div class="llm-control"><div class="llm-control-main"><h4>采样温度（temperature）的概念演示</h4><p>拖动滑块只展示倾向，不代表某个具体模型的精确行为。需要稳定格式或工具参数时，通常选择更保守的设置；创意任务可适度提高多样性。</p><input class="llm-range" id="llmTemperature" type="range" min="0" max="100" value="25" aria-label="采样温度演示"><div class="llm-range-read"><span>更确定</span><strong id="llmTempValue">0.25 · 稳定优先</strong><span>更多样</span></div><div class="llm-choices" id="llmChoices"><div class="llm-choice active">“合同将于明天到期。”</div><div class="llm-choice">“该合同的截止日期是明天。”</div><div class="llm-choice">“明天就是这份合同的到期日。”</div><div class="llm-choice">“需要尽快确认合同续签安排。”</div></div></div><aside class="llm-control-side"><h4>工程上的处理</h4><p><b>事实、工具和结构化输出：</b>优先稳定、可校验的输出，并设置 JSON 模式或参数验证。</p><p><b>创意、头脑风暴和文案：</b>可允许更多表达变化，但仍需检查事实来源和品牌规范。</p><p><b>注意：</b>温度只是众多采样和解码参数之一，不能把质量问题都归因给它。</p></aside></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">06 / Limits</p><h3>把 LLM 放在合适的位置</h3></div><p class="llm-note">最常见的失误，是把语言上的流畅误认为事实上的可靠。明确分工能让 Agent 同时拥有表达能力、证据和边界。</p></div><div class="llm-boundaries"><div class="llm-do"><h4>适合交给 LLM</h4><ul><li>理解自然语言目标、归纳和改写信息。</li><li>在有限选项间提出计划或工具调用建议。</li><li>从证据中生成带引用的说明草案。</li><li>将不同格式的信息组织成用户易读的结果。</li></ul></div><div class="llm-dont"><h4>不应只靠 LLM</h4><ul><li>最新事实、精确数值、权限判断：接入可信数据和规则。</li><li>不可逆操作：加入参数校验、审批和幂等性控制。</li><li>高风险决策：保留人工复核和可解释的证据链。</li><li>长期记忆：使用可管理、可更新、可删除的外部存储。</li></ul></div></div></div>
          <div class="llm-part"><div class="llm-part-head"><div><p class="llm-kicker">Evidence</p><h3>继续阅读</h3></div><p class="llm-note">这些来源分别支持 Transformer 架构、RAG、上下文局限、工具调用和 Agent 框架的关键判断。</p></div><ul class="refs"><li><a href="${refs.transformer[1]}" target="_blank" rel="noreferrer">Attention Is All You Need</a></li><li><a href="${refs.rag[1]}" target="_blank" rel="noreferrer">Retrieval-Augmented Generation</a></li><li><a href="${refs.middle[1]}" target="_blank" rel="noreferrer">Lost in the Middle</a></li><li><a href="${refs.toolformer[1]}" target="_blank" rel="noreferrer">Toolformer</a></li><li><a href="${refs.agentsdk[1]}" target="_blank" rel="noreferrer">OpenAI Agents SDK</a></li></ul><a class="other-link" href="#childDetail">返回大语言模型概览 -></a></div>
        </section>`;
      const slider = document.getElementById('llmTemperature');
      const value = document.getElementById('llmTempValue');
      const choices = [...document.querySelectorAll('.llm-choice')];
      slider.addEventListener('input', () => {
        const temperature = Number(slider.value);
        const label = temperature < 34 ? '稳定优先' : temperature < 67 ? '平衡选择' : '多样性更高';
        value.textContent = `${(temperature / 100).toFixed(2)} · ${label}`;
        choices.forEach((item, index) => item.classList.toggle('active', index === Math.min(3, Math.floor(temperature / 27))));
      });
    }
    function renderDetail({ preserveHash = false } = {}) {
      const child = activeChild;
      const pipeline = child.steps.map((step, index) => `<div class="step">${escapeHtml(step)}<small>${index === 0 ? '输入或触发' : index === child.steps.length - 1 ? '输出或判断' : '处理中间环节'}</small></div>${index < child.steps.length - 1 ? '<span class="flow-arrow">-></span>' : ''}`).join('');
      const childRefs = (foundationMechanics[child.id]?.refs || mechanicsProfiles[child.id]?.refs || topic.refs).slice(0, 3);
      const special = `<a class="other-link" href="#child-visual">展开：大话${escapeHtml(child.title)}图解 -></a>`;
      document.getElementById('childDetail').innerHTML = `
        <div class="detail-main"><p class="detail-label">子模块图解 / ${String(topic.children.indexOf(child) + 1).padStart(2, '0')}</p><h3>${escapeHtml(child.title)} <span class="term">${escapeHtml(child.english)}</span></h3>
        <p class="definition">${escapeHtml(child.definition)}</p><h4 class="visual-title">工作过程（简化示意）</h4><div class="pipeline">${pipeline}</div>
        <div class="quick-grid"><div class="quick"><b>它产生什么</b><span>${escapeHtml(child.output)}</span></div><div class="quick"><b>新手容易混淆</b><span>${escapeHtml(child.confusion)}</span></div></div>${special}</div>
        <aside class="detail-side"><h4>场景</h4><p>${escapeHtml(child.example)}</p><div class="side-block"><strong>相关资料</strong><ul class="refs">${refLinks(childRefs)}</ul></div></aside>`;
      document.getElementById('childHeading').textContent = `当前子模块：${child.title}`;
      document.querySelectorAll('.component-nav-button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.child === child.id)));
      renderDeepDive();
      updateUrl({ preserveHash });
    }
    function renderPage() {
      const componentButtons = topic.children.map((child, index) => `<button class="component-nav-button" type="button" data-child="${child.id}" aria-pressed="false"><span>${String(index + 1).padStart(2,'0')} / 子模块</span><strong>${escapeHtml(child.title)}</strong><small>${escapeHtml(child.english)}</small></button>`).join('');
      const structure = topic.structure.map(item => `<div><strong>${escapeHtml(item[0])}</strong><span>${escapeHtml(item[1])}</span></div>`).join('');
      componentNav.innerHTML = componentButtons;
      content.innerHTML = `
        <header><p class="crumb">${topic.no} / ${escapeHtml(topic.english)}</p><h1>${escapeHtml(topic.title)}<span>${escapeHtml(topic.english)}：${escapeHtml(topic.core)}</span></h1><p class="intro">${escapeHtml(topic.intro)}</p><p class="question"><b>本模块要回答的问题：</b>${escapeHtml(topic.question)}</p><p class="counterpart">对应面试练习：<a href="../interview/questions.html?topic=${interviewTopicMap[topicKey]}">进入「${escapeHtml(topic.title)}」高频面试题</a></p></header>
        <section class="section"><div class="section-head"><div><h2>它在系统中的位置与关联</h2></div></div>${relationshipSvg()}<div class="structure-list">${structure}</div>${foundationPrimer()}</section>
        <section class="section" id="childExplain"><div class="section-head"><div><h2 id="childHeading">当前子模块：${escapeHtml(activeChild.title)}</h2></div></div><div class="detail" id="childDetail"></div><div id="llmDeepDive"></div></section>
        <section class="section"><div class="section-head"><div><h2>本模块的主要参考</h2></div></div><ul class="refs">${refLinks(topic.refs)}</ul></section>`;
      document.querySelectorAll('.component-nav-button').forEach(button => button.addEventListener('click', () => { activeChild = topic.children.find(child => child.id === button.dataset.child); renderDetail(); document.getElementById('childExplain').scrollIntoView({behavior:'smooth', block:'start'}); }));
      renderDetail({ preserveHash: true });
    }
    renderPage();
    if (['#child-visual', '#llm-visual', '#llm-mechanics'].includes(location.hash) || location.hash.startsWith('#mechanics-')) {
      requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView({ block:'start' }));
    }
  </script>
</body>
